function rReceber(){const pend=(S.recebidos||[]).filter(r=>!r.enviado);const tot=pend.reduce((t,r)=>t+valorRec(r),0);

  let h=`<div class=card><h2 style="margin:0 0 4px">Receber pagamentos</h2><p class=muted style="margin:0">Registre aqui o dinheiro que você recebeu: mensalidade (atrasada ou adiantada), amistoso, padrão (uniforme), diária de convidado ou cartão. Depois toque em <b>Mais › Enviar</b> e o diretor financeiro recebe tudo atualizado.</p></div>`;
  if(pend.length)h+=`<div class=card style="border-color:var(--neon)"><div class=row><h3 class=grow style="margin:0">Com você, ainda não enviado</h3><b style="color:var(--neon);font-family:'Bebas Neue';font-size:26px">${brl(tot)}</b></div>
    ${pend.slice().reverse().map(r=>`<div class=ev onclick="desfazerRec('${r.id}')"><span class=tm>${fmtData(r.data).slice(0,5)}</span><span class=grow><b>${esc(r.nome)}</b> · ${descRec(r)} · ${brl(valorRec(r))}</span></div>`).join('')}
    <p class=muted style="margin:6px 0 10px">Toque num pagamento para desfazer.</p><button class="btn block" onclick="exportarBabas(true)">Enviar ao diretor</button></div>`;
  h+=`<input placeholder="🔎 Buscar jogador..." oninput="filtrar(this.value)" style="margin-bottom:10px"><div class="card list" style="padding:4px 12px">${js.map(j=>{const atr=emAtraso(j),ct=cartoesAbertos(j).find(c=>!c.pago);

    return`<div class=it data-n="${esc(norm(j.nome))}" style="cursor:default;flex-wrap:wrap"><div class=grow><b>${esc(j.nome)}</b><div class=sub>${st}${ct?`<span class="tag red">${COR[ct.tipo]} cartão</span>`:''}</div></div>
    <div class=gap style="flex-basis:100%;margin-top:8px">${!j.convidado&&!j.isento&&!j.diretor?`<button class="btn sm sec" onclick="abrirReceberR('${j.id}','')">Mensalidade</button>`:''}${j.convidado&&j.devendo?`<button class="btn sm sec" onclick="abrirReceberR('${j.id}','')">Diária</button>`:''}${ct?`<button class="btn sm sec" onclick="abrirCartaoPag('${ct.id}','')">Cartão</button>`:''}${!j.convidado?`<button class="btn sm sec" onclick="abrirOutroR('${j.id}','amistoso')">Amistoso</button><button class="btn sm sec" onclick="abrirOutroR('${j.id}','padrao')">Padrão</button>`:''}</div></div>`}).join('')}</div>`;
  return h}
function desfazerRec(rid){const r=S.recebidos.find(x=>x.id===rid);confirmar(`Desfazer o pagamento de <b>${esc(r.nome)}</b>?`,()=>{const j=getJ(r.jogId);

  const ids=new Set(S.babas.map(b=>b.id));const novos=(d.babas||[]).filter(b=>b&&b.id&&!ids.has(b.id));
  novos.forEach(b=>{S.babas.push({id:b.id,data:b.data,presentes:b.presentes||[],partidas:b.partidas||[],conv:b.conv||{},origem:'outro celular'});
    Object.entries(b.conv||{}).forEach(([id,c])=>{let j=getJ(id);if(!j){j={id,nome:c.nome,convidado:true,pos:'linha',posicao:'',plano:'sab',ativo:true,isento:false,notas:{},inicio:mesAtual()};S.jogadores.push(j)}
      const v=+S.config.valorConvidado;if(c.pago)S.lanc.push({id:uid(),tipo:'e',cat:'Convidado',desc:`Convidado — ${j.nome} (${fmtData(b.data).slice(0,5)}, outro celular)`,valor:v,data:b.data,jogId:id});else S.pendConv.push({id:uid(),jogId:id,data:b.data,valor:v})})});
  let nc=0;(d.cartoes||[]).forEach(c=>{if(!c||!c.id||S.cartoes.some(x=>x.id===c.id))return;S.cartoes.push({...c,local:undefined,origem:(c.origem||'')+' (outro celular)'});nc++});
  S.recImport=S.recImport||[];let nr=0,tot=0;const quem=new Set();
  (d.recebidos||[]).forEach(r=>{if(!r||!r.id||S.recImport.includes(r.id))return;S.recImport.push(r.id);const j=getJ(r.jogId);if(!j)return;nr++;quem.add(r.quem);
    if(r.tipo==='cartao'){let c=S.cartoes.find(x=>x.id===r.cartaoId);if(!c&&r.cartao){c={...r.cartao,local:undefined};S.cartoes.push(c)}if(c&&!c.pago){c.pago=true;S.lanc.push({id:uid(),tipo:'e',cat:'Cartões',desc:`Cartão ${c.tipo} — ${j.nome} (recebido por ${r.quem})`,valor:+r.valor,data:r.data,jogId:j.id,cartaoId:c.id});tot+=+r.valor}}
    else if(r.tipo==='convidado'){const ps=S.pendConv.filter(p=>p.jogId===j.id&&p.data<=r.data);S.lanc.push({id:uid(),tipo:'e',cat:'Convidado',desc:`Convidado — ${j.nome} (diária pendente, recebido por ${r.quem})`,valor:+r.valor,data:r.data,jogId:j.id});tot+=+r.valor;S.pendConv=S.pendConv.filter(p=>!ps.includes(p))}
    else if(r.tipo==='amistoso'||r.tipo==='padrao'){const ev=r.eventoId&&S.eventos.find(e=>e.id===r.eventoId);
      S.lanc.push(r.tipo==='padrao'?{id:uid(),tipo:'e',cat:'Uniforme',caixa:'Padrão',desc:`Uniforme — ${j.nome} (recebido por ${r.quem})`,valor:+r.valor,data:r.data,jogId:j.id}
        :ev?{id:uid(),tipo:'e',cat:'Evento',caixa:ev.caixa||'Amistoso',desc:`${ev.nome} — ${j.nome} (recebido por ${r.quem})`,valor:+r.valor,data:r.data,eventoId:ev.id,jogId:j.id}
        :{id:uid(),tipo:'e',cat:'Amistoso',caixa:'Amistoso',desc:`Amistoso — ${j.nome} (recebido por ${r.quem})`,valor:+r.valor,data:r.data,jogId:j.id});tot+=+r.valor}
    else r.meses.forEach(m=>{if(pagoLanc(j,m))return;S.lanc.push({id:uid(),tipo:'e',cat:'Mensalidade',desc:`Mensalidade ${nomeMes(m)} — ${j.nome} (recebido por ${r.quem})`,valor:+r.valor,data:r.data,jogId:j.id,mes:m});tot+=+r.valor})});
  save();render();
  const partes=[];if(novos.length)partes.push(`${novos.length} baba${novos.length>1?'s':''} na frequência`);if(nc)partes.push(`${nc} cartão(ões) aplicado(s)`);if(nr)partes.push(`${nr} pagamento${nr>1?'s':''} (${brl(tot)}) recebido${nr>1?'s':''} por ${[...quem].join(', ')}`);
  if(nr||nc)abre(`<h2>Importado</h2><p>${partes.join(' e ')}.</p><p class=muted>Os pagamentos já entraram nas mensalidades e no caixa. Lembre de pegar o dinheiro com quem recebeu.</p><button class="btn block" onclick="fecha()">Ok</button>`);
  else toast(novos.length?partes[0]:'Esses babas já estavam aqui')}
function importar(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast('Arquivo inválido');return}
  if(d&&d.tipo==='acp-abertura')return importarAbertura(d);
  if(d&&d.tipo==='acp-pacote-baba')return importarPacote(d);
  if(d&&d.tipo==='acp-babas')return importarBabas(d);
  if(restrito()){toast('Neste celular só dá para importar o pacote do baba');return}
  if(!d||!Array.isArray(d.jogadores)||!Array.isArray(d.lanc)){toast('Esse arquivo não é um backup da ACP');return}
  confirmar(`Restaurar o backup? Os dados atuais deste aparelho serão <b>substituídos</b> por ${d.jogadores.length} jogadores, ${d.lanc.length} lançamentos e ${(d.babas||[]).length} babas.`,()=>{
    const df=defaults();delete d.app;delete d.exportadoEm;S=Object.assign(df,d,{config:Object.assign(df.config,d.config||{})});save();ui.porTime=S.config.porTime;render();toast('Backup restaurado')},'Restaurar')};
  r.readAsText(f);inp.value=''}

if(temDOM&&document.getElementById('app')){render();
  setTimeout(()=>{const sp=document.getElementById('splash');if(sp){sp.classList.add('fora');setTimeout(()=>sp.remove(),500)}},700);
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_instalar=e;if(tab==='mais')render()});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').then(reg=>{
    const avisa=w=>{const b=document.getElementById('upd');b.classList.remove('hidden');b.onclick=()=>{w.postMessage('skipWaiting')}};
    if(reg.waiting&&navigator.serviceWorker.controller)avisa(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)avisa(w)})});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000)}).catch(()=>{});
    let rec=false;const tinha=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rec||!tinha)return;rec=true;location.reload()})}
  setInterval(()=>{const A=S.atual;if(!A||!A.jogo)return;const t=tempoJogo(),e=document.getElementById('crono');if(e)e.textContent=fmtT(t);
    const d=+S.config.duracao*60;if(d&&t>=d){if(e)e.classList.add('over');if(!A.jogo.avisado){A.jogo.avisado=true;save();try{navigator.vibrate&&navigator.vibrate([500,200,500,200,500])}catch(x){}toast('⏱ Tempo esgotado!')}}},1000)}
</script>
