:root{--neon:#39ff14;--g:#39ff14;--g2:#39ff14;--gl:rgba(57,255,20,.13);--y:#ffd23f;--yl:rgba(255,210,63,.14);--r:#ff4b4b;--tx:#f2f2f2;--mu:#8f948f;--bg:#000;--card:#111;--card2:#191919;--bd:#262626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.35}
.bb,h2,h3,h4,.btn,.stat b,.pt b,.pt small,#crono,.badge,.mhead b,nav button,.seg button,.tag,.rk b.v,.rk .p,.pl .n,.vs{font-family:'Bebas Neue',system-ui,sans-serif;font-weight:400;letter-spacing:.04em}
header{position:sticky;top:0;z-index:5;background:#000;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid var(--neon)}
.brand{display:flex;align-items:baseline;gap:10px}.brand b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:32px;letter-spacing:.05em;line-height:1;color:#fff}.brand b i{font-style:normal;color:var(--neon)}.brand span{opacity:.7;font-size:12px}
#topinfo{font-size:11px;color:var(--mu);text-align:right}
main{max-width:760px;margin:0 auto;padding:12px 12px 100px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;max-width:150px;border:0;background:none;padding:7px 0 8px;font-size:14px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav button .i{font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.7}nav button.on{color:var(--neon)}nav button.on .i{filter:none;opacity:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:26px;margin:0 0 10px;line-height:1.05}h3{font-size:21px;margin:0 0 8px;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.muted{color:var(--mu);font-size:13px}
.btn{border:0;border-radius:10px;padding:10px 14px 8px;font-size:19px;background:var(--neon);color:#000;cursor:pointer;line-height:1.1}
.btn.sec{background:var(--gl);color:var(--neon)}.btn.red{background:var(--r);color:#fff}.btn.ghost{background:transparent;color:var(--neon);border:1px solid #333}
.btn.sm{padding:6px 10px 4px;font-size:16px}.btn.block{width:100%}.btn:disabled{opacity:.3}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #333;border-radius:10px;background:var(--card2);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--neon);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}label>input,label>select,label>textarea{margin-top:4px}
label.ck{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:15px;padding:6px 0;margin:0}label.ck input{width:20px;height:20px;margin:0;accent-color:var(--neon)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.stat small{color:var(--mu);font-size:12px;display:block}.stat b{font-size:28px;line-height:1.1}
.stat.g b{color:var(--neon)}.stat.r b{color:var(--r)}
.tag{display:inline-block;font-size:15px;padding:2px 8px 0;border-radius:20px;margin:0 4px 2px 0;white-space:nowrap}
.tag.red{background:rgba(255,75,75,.15);color:#ff7a7a}.tag.yel{background:var(--yl);color:var(--y)}.tag.grn{background:var(--gl);color:var(--neon)}.tag.gray{background:#222;color:#aaa}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--bd);cursor:pointer}.list .it:last-child{border:0}
.pres{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:12px;margin-bottom:6px;background:var(--card);cursor:pointer;user-select:none}
.pres.on{border-color:var(--neon);background:rgba(57,255,20,.07)}.pres.bloq{background:#0c0c0c}.pres.bloq b{color:var(--mu)}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid #3a3a3a;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;flex:none;font-size:14px}
.pres.on .chk{background:var(--neon);border-color:var(--neon)}.pres.bloq .chk{border-style:dashed;color:var(--mu)}
.sub{margin-top:3px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mhead b{font-size:24px}
.mhead button{border:1px solid #333;background:var(--card);color:var(--neon);border-radius:10px;width:42px;height:36px;font-size:18px;cursor:pointer}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:6px 11px 4px;border-radius:8px;color:var(--mu);font-size:17px;cursor:pointer}
.seg button.on{background:var(--neon);color:#000}
.foot{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:4;padding:8px 10px}
.foot .in{max-width:760px;margin:0 auto;background:#0d0d0d;border:1px solid #2c2c2c;border-radius:14px;padding:10px;box-shadow:0 -6px 24px rgba(0,0,0,.7)}
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start}
.vs{color:var(--neon);padding-top:30px;font-size:26px}
.team{border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--card2);min-width:0}
.team.quadra{border:2px solid var(--neon)}
.team h4{margin:0 0 6px;font-size:22px;line-height:1.1}
.pl{font-size:14px;padding:3px 0;display:flex;gap:6px;align-items:center;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pl .n{min-width:26px;height:21px;border-radius:6px;background:var(--neon);color:#000;font-size:15px;display:inline-flex;align-items:center;justify-content:center;padding:1px 4px 0;flex:none}
.pl.gk .n{background:#fff;color:#000}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}.res .btn{padding:10px 6px 8px;font-size:17px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:flex;align-items:flex-end;justify-content:center}.hidden{display:none}
.sheet{background:#121212;border-top:2px solid var(--neon);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px;border:1px solid var(--neon)}}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--neon);color:#000;font-weight:600;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}#toast.show{opacity:1}
.bar{height:6px;background:#222;border-radius:4px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--neon)}
.slider{margin-bottom:6px}.slider .row{justify-content:space-between;font-size:14px}input[type=range]{padding:0;border:0;background:none;accent-color:var(--neon)}
.v-e{color:var(--neon);font-weight:700;white-space:nowrap}.v-s{color:#ff7a7a;font-weight:700;white-space:nowrap}

.placar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}.pt b{font-size:78px;display:block;line-height:.95;color:#fff}.pt small{color:var(--mu);font-size:18px}

.ev{font-size:14px;padding:7px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px;cursor:pointer}.ev:last-child{border:0}.ev .tm{color:var(--neon);font-variant-numeric:tabular-nums;min-width:40px}

<body>
<div id="splash"><div class="sp-in"><b>DEU <i>BABA</i></b><span>ACP · 50 Anos</span></div></div>
<button id="upd" class="hidden">🔄 Nova versão disponível · <u>toque para atualizar</u></button>
<header><div class="brand"><b>DEU <i>BABA</i></b><span>ACP · 50 Anos</span></div><div id="topinfo"></div></header>
<main id="app"></main>
<nav id="nav">
  <button data-t="baba" onclick="go('baba')"><span class="i">⚽</span>Baba</button>
  <button data-t="jog" onclick="go('jog')"><span class="i">👥</span>Jogadores</button>
  <button data-t="mens" onclick="go('mens')"><span class="i">🧾</span>Mensalidades</button>
  <button data-t="caixa" onclick="go('caixa')"><span class="i">💰</span>Caixa</button>

</nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)fecha()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
/* ===================== utilidades ===================== */
const KEY='acp_controle_v1';
const APP_VERSION='1.0.0';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pad=n=>String(n).padStart(2,'0');
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ymOf=s=>String(s).slice(0,7);
const mesAtual=()=>ymOf(hoje());
const addMes=(m,n)=>{let[y,mm]=m.split('-').map(Number);mm+=n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+pad(mm)};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const nomeMes=m=>{const[y,mm]=m.split('-');return MESES[+mm-1]+' '+y};
const fmtData=s=>{const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const SEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const diaSemana=s=>new Date(s+'T12:00:00').getDay();
const diaDe=d=>{const w=diaSemana(d);return w===2?'ter':w===6?'sab':null};
const DIAS={ter:'Só terça',sab:'Só sábado',ambos:'Terça e sábado'};
const CAT_E=['Convidado','Cartões','Amistoso','Uniforme','Doação','Patrocínio','Evento','Outros'];
const CAT_S=['Aluguel','Arbitragem','Amistoso','Uniforme','Evento','Material esportivo','Água/lanche','Manutenção','Outros'];
const CAIXAS=['Associação','Arbitragem','Amistoso','Padrão'];
const CAIXA_ICON={'Associação':'🏠','Arbitragem':'🟨','Amistoso':'🤝','Padrão':'👕'};
const soma=a=>a.reduce((t,l)=>t+(+l.valor||0),0);
function caixaDe(l){if(l.caixa)return l.caixa;const c=l.cat;if(c==='Cartões'||c==='Arbitragem')return'Arbitragem';if(c==='Amistoso')return'Amistoso';if(c==='Uniforme')return'Padrão';
  if(l.eventoId){const ev=(typeof S!=='undefined'&&S.eventos||[]).find(e=>e.id===l.eventoId);if(ev&&ev.caixa)return ev.caixa}return'Associação'}
function saldoCaixa(cx,ate){const si=(S.config.saldosIniciais||{})[cx]||0;return+si+S.lanc.filter(l=>l.data<=ate).reduce((t,l)=>{const v=+l.valor||0;
  if(l.tipo==='t')return t+(l.para===cx?v:0)-(l.de===cx?v:0);if(caixaDe(l)!==cx)return t;return t+(l.tipo==='e'?v:-v)},0)}
const saldoTotal=ate=>CAIXAS.reduce((t,c)=>t+saldoCaixa(c,ate),0);
const optCaixa=(sel)=>CAIXAS.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('');
const temDOM=typeof document!=='undefined';

/* ===================== dados ===================== */
function defaults(){return{v:1,config:{valorUm:30,valorDois:45,valorConvidado:10,valorAmarelo:15,valorVermelho:20,suspVermelho:1,vencimento:10,inicioCobranca:mesAtual(),porTime:6,linhaTer:6,linhaSab:6,posicoes:['Goleiro','Zagueiro','Lateral direito','Lateral esquerdo','Volante','Meia','Meia-atacante','Ponta direita','Ponta esquerda','Centroavante'],
  criterios:['Velocidade','Ataque','Defesa','Desarme','Condicionamento físico'],pesoIdade:0.5,aluguel:1300,saldoInicial:0,saldosIniciais:{'Associação':0,'Arbitragem':0,'Amistoso':0,'Padrão':0},dataAbertura:'',horaTer:'19:00',horaSab:'17:00',tolerancia:30,duracao:10,mostrarMedias:true,ultimoBackup:null},
  jogadores:[],lanc:[],babas:[],eventos:[],pendConv:[],recebidos:[],cartoes:[],atual:null}}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}const d=defaults();if(!s||typeof s!=='object')return d;
  return Object.assign(d,s,{config:Object.assign(d.config,s.config||{})})}
let S=load(),salvaOk=true;
if(!S.config.v3){S.jogadores.forEach(j=>{if(j.posicao==null)j.posicao=j.pos==='goleiro'?'Goleiro':''});S.config.v3=true}
function linhaDoDia(d){const c=S.config,w=diaDe(d);const v=w==='sab'?c.linhaSab:c.linhaTer;return Math.max(1,+v||6)}
function posicoes(){let p=(S.config.posicoes||[]).filter(Boolean);if(!p.some(x=>norm(x)==='goleiro'))p=['Goleiro',...p];return p}
if(!S.config.v4){const ix=S.config.criterios.indexOf('Idade');if(ix>=0){S.config.criterios[ix]='Condicionamento físico';S.jogadores.forEach(j=>{if(j.notas&&'Idade'in j.notas){j.notas['Condicionamento físico']=j.notas['Idade'];delete j.notas['Idade']}})}S.config.v4=true}
if(!Array.isArray(S.eventos))S.eventos=[];
if(!S.config.v5){S.config.saldosIniciais=S.config.saldosIniciais||{};if(+S.config.saldoInicial&&!+S.config.saldosIniciais['Associação'])S.config.saldosIniciais['Associação']=+S.config.saldoInicial;S.config.saldoInicial=0;S.config.v5=true}
if(!Array.isArray(S.pendConv))S.pendConv=[];if(!Array.isArray(S.recebidos))S.recebidos=[];if(!Array.isArray(S.cartoes))S.cartoes=[];
if(!S.config.v2){if(S.config.horaSab==='19:00')S.config.horaSab='17:00';S.config.v2=true}
const restrito=()=>S.modo==='sorteio';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));salvaOk=true}catch(e){salvaOk=false}}

const getJ=id=>S.jogadores.find(j=>j.id===id);
const nomeJ=id=>(getJ(id)||{}).nome||'(removido)';
const byNome=(a,b)=>a.nome.localeCompare(b.nome,'pt-BR');
const valorPlano=j=>j.plano==='ambos'?+S.config.valorDois:+S.config.valorUm;
function inicioJ(j){const a=S.config.inicioCobranca,b=j.inicio||a;return b>a?b:a}
const pagoLanc=(j,m)=>S.lanc.find(l=>l.jogId===j.id&&l.mes===m);
const cobravel=j=>j.ativo&&!j.isento&&!j.convidado&&!j.diretor;
function mesesEmAberto(j,ate){if(!cobravel(j))return[];const out=[];let m=inicioJ(j),g=0;while(m<=ate&&g++<240){if(!pagoLanc(j,m))out.push(m);m=addMes(m,1)}return out}
function vencido(m){const c=mesAtual();return m<c||(m===c&&+hoje().slice(8)>+S.config.vencimento)}
function emAtraso(j){if(j.convidado)return restrito()?(j.devendo?['diária']:[]):S.pendConv.filter(p=>p.jogId===j.id&&p.data<hoje()).map(p=>p.data);
  if(restrito()){if(!j.ativo||j.isento||j.diretor||!j.pagoAte)return[];const out=[];let m=addMes(j.pagoAte,1),g=0;while(m<=mesAtual()&&g++<240){out.push(m);m=addMes(m,1)}return out.filter(vencido)}
  return mesesEmAberto(j,mesAtual()).filter(vencido)}
function pagoAteJ(j){let m=inicioJ(j),g=0;while(pagoLanc(j,m)&&g++<240)m=addMes(m,1);return addMes(m,-1)}
function idade(n,ref){if(!n||!/^\d{4}-\d{2}-\d{2}$/.test(n))return null;const h=ref||hoje();let a=+h.slice(0,4)-+n.slice(0,4);if(h.slice(5)<n.slice(5))a--;return a>=0&&a<120?a:null}
const notaIdade=a=>a<=25?10:Math.max(3,10-(a-25)*0.2);
function mediaDe(notas,nasc){const cs=S.config.criterios;let s=0,n=0;cs.forEach(c=>{const v=notas&&notas[c];s+=v==null?5:+v;n++});
  const w=+S.config.pesoIdade||0,a=idade(nasc);if(w&&a!=null){s+=w*notaIdade(a);n+=w}return n?s/n:5}
function media(j){return j?mediaDe(j.notas,j.nasc):5}
function proxAniv(n){if(!n)return null;const h=hoje();const y=+h.slice(0,4);let d=y+n.slice(4);if(n.slice(5)==='02-29'&&!(y%4===0&&(y%100||y%400===0)))d=y+'-03-01';if(d<h)d=(y+1)+n.slice(4);
  const diff=Math.round((new Date(d+'T12:00:00')-new Date(h+'T12:00:00'))/864e5);return{data:d,dias:diff,faz:idade(n,d)}}
function aniversariantes(dias){return S.jogadores.filter(j=>j.ativo&&j.nasc).map(j=>({j,...proxAniv(j.nasc)})).filter(x=>x.dias<=dias).sort((a,b)=>a.dias-b.dias)}
function cardAniv(){const L=aniversariantes(7);if(!L.length)return'';const hj=L.filter(x=>x.dias===0),sem=L.filter(x=>x.dias>0);
  return`<div class=card style="border-color:var(--neon)"><h3 style="margin-bottom:4px">🎂 Aniversariantes</h3>${hj.map(x=>`<div style="font-size:16px;margin:4px 0"><b style="color:var(--neon)">Hoje!</b> ${esc(x.j.nome)} faz <b>${x.faz} anos</b> 🎉</div>`).join('')}
  ${sem.map(x=>`<div class=muted style="margin:3px 0">${SEM[diaSemana(x.data)]} ${fmtData(x.data).slice(0,5)} · <span style="color:var(--tx)">${esc(x.j.nome)}</span> faz ${x.faz} anos${x.dias===1?' (amanhã)':''}</div>`).join('')}
  ${hj.length?`<button class="btn sec sm" style="margin-top:8px" onclick="parabens()">Mandar parabéns no grupo</button>`:''}</div>`}
function parabens(){const L=aniversariantes(0);compartilhar(`🎂 DEU BABA — ACP\n\nHoje é aniversário de ${L.map(x=>`*${x.j.nome}* (${x.faz} anos)`).join(' e ')}! 🎉⚽\nParabéns da família ACP!`)}

/* ===================== sorteio ===================== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const r=Math.floor(Math.random()*(i+1));[a[i],a[r]]=[a[r],a[i]]}return a}
function montarTimes(ids,k,bal){
  const n=ids.length,nf=Math.floor(n/k),r=n%k,nt=nf+(r?1:0);
  const caps=Array.from({length:nt},(_,i)=>i<nf?k:r);
  if(!bal){const a=shuffle([...ids]),out=[];let p=0;caps.forEach(c=>{out.push(a.slice(p,p+c));p+=c});return out}
  const m={};ids.forEach(id=>m[id]=media(getJ(id)));
  const avgAll=ids.reduce((s,id)=>s+m[id],0)/n;
  const pz={},posCount={};ids.forEach(id=>{const p=(getJ(id)||{}).posicao||'';pz[id]=p;if(p)posCount[p]=(posCount[p]||0)+1});
  const cands=[];
  for(let it=0;it<500;it++){
    const ord=ids.map(id=>({id,v:m[id]+(Math.random()-.5)*1.6})).sort((a,b)=>b.v-a.v);
    const T=caps.map(()=>[]),tOrd=shuffle([...Array(nt).keys()]);let p=0,round=0;
    while(p<ord.length){const sq=round%2?[...tOrd].reverse():tOrd;for(const t of sq){if(p>=ord.length)break;if(T[t].length<caps[t])T[t].push(ord[p++].id)}round++}
    const sums=T.slice(0,nf).map(t=>t.reduce((s,id)=>s+m[id],0));
    const mean=sums.reduce((a,b)=>a+b,0)/(sums.length||1);
    let sc=Math.sqrt(sums.reduce((s,x)=>s+(x-mean)**2,0)/(sums.length||1));
    if(r){const ai=T[nt-1].reduce((s,id)=>s+m[id],0)/r;sc+=Math.abs(ai-avgAll)*0.5*r}
    if(nf>1)Object.keys(posCount).forEach(ps=>{const c=T.slice(0,nf).map(t=>t.filter(id=>pz[id]===ps).length);sc+=(Math.max(...c)-Math.min(...c)>1?(Math.max(...c)-Math.min(...c)-1)*1.2:0)});
    cands.push({sc,T});
  }
  const min=Math.min(...cands.map(c=>c.sc));
  const bons=cands.filter(c=>c.sc<=min+0.6);
  return bons[Math.floor(Math.random()*bons.length)].T.map(t=>shuffle([...t]));
}

/* ===================== rotação do baba ===================== */
function babaAtual(){return S.atual&&S.babas.find(b=>b.id===S.atual.babaId)}
function snap(){const{hist,...r}=S.atual;S.atual.hist.push(JSON.stringify(r));if(S.atual.hist.length>80)S.atual.hist.shift()}
function atribuiGol(){const A=S.atual;for(const t of[...A.quadra,...A.fila]){if(!t.gol&&A.filaGol.length)t.gol=A.filaGol.shift()}}
function ultimoIncompleto(){const A=S.atual,k=A.porTime;const last=A.fila[A.fila.length-1];if(last)return last.jog.length<k?last:null;return A.quadra.find(t=>t.jog.length<k)||null}
function puxaReservas(){const A=S.atual;if(!A.reservas)A.reservas=[];let t;
  while(A.reservas.length){t=ultimoIncompleto();if(t)t.jog.push({id:A.reservas.shift(),seq:A.seqNext++});
    else if(A.quadra.length+A.fila.length<2)A.fila.push({num:A.prox++,jog:[{id:A.reservas.shift(),seq:A.seqNext++}],gol:null});else break}}
function entra(){const A=S.atual;puxaReservas();while(A.quadra.length<2&&A.fila.length)A.quadra.push(A.fila.shift());atribuiGol()}
// time que sai de quadra: na ordem do time, completa o último time incompleto da fila; o saldo vira um novo time no fim
function sai(t){const A=S.atual,k=A.porTime;const jog=[...t.jog];
  if(t.gol)A.filaGol.push(t.gol);
  const last=A.fila[A.fila.length-1];
  if(last&&last.jog.length<k)while(last.jog.length<k&&jog.length)last.jog.push(jog.shift());
  if(jog.length)A.fila.push({num:A.prox++,jog,gol:null})}
function sync(){const A=S.atual,b=babaAtual();limpaCartoes();if(b){b.presentes=[...A.presentes];b.partidas=A.log.map(x=>({...x}))}save();render()}
function vencer(i){const A=S.atual;if(A.quadra.length<2)return;snap();const w=A.quadra[i],l=A.quadra[1-i];
  A.log.push(fechaJogo({a:A.quadra[0].num,b:A.quadra[1].num,v:w.num}));A.quadra=[w];sai(l);entra();sync();
  toast(`Time ${l.num} saiu · entra o Time ${A.quadra[1]?A.quadra[1].num:'—'}`)}
function empateRes(i){const A=S.atual;snap();const p=A.quadra[i],o=A.quadra[1-i];
  A.log.push(fechaJogo({a:A.quadra[0].num,b:A.quadra[1].num,v:0,par:p.num}));A.quadra=[];sai(p);sai(o);entra();fecha();sync()}
/* ----- partida ao vivo ----- */
const ESTILOS_GOL=['Normal','De cabeça','Bicicleta','Gol de placa','Falta','Pênalti','Contra'];
const ESTILOS_DEF=['Defesa','Paredão','Pênalti defendido'];
const fmtT=s=>pad(Math.floor(s/60))+':'+pad(s%60);
const idsTime=t=>t?[...(t.gol?[t.gol]:[]),...t.jog.map(p=>p.id)]:[];
function tempoJogo(){const J=S.atual&&S.atual.jogo;if(!J)return 0;return Math.max(0,Math.floor(((J.pausadoEm||Date.now())-J.inicio-J.pausa)/1000))}
function placar(i){const A=S.atual,J=A.jogo,t=A.quadra[i];return J&&t?J.eventos.filter(e=>e.tipo==='gol'&&e.time===t.num).length:0}
function fechaJogo(e){const A=S.atual;e.ja=idsTime(A.quadra[0]);e.jb=idsTime(A.quadra[1]);
  if(A.jogo){e.pa=placar(0);e.pb=placar(1);e.ev=A.jogo.eventos;e.dur=tempoJogo();A.jogo=null}return e}
function comecar(){const A=S.atual;if(A.quadra.length<2)return;snap();A.jogo={inicio:Date.now(),pausa:0,pausadoEm:null,eventos:[],avisado:false,ta:A.quadra[0].num,tb:A.quadra[1].num};sync()}
function pausar(){const J=S.atual.jogo;if(J.pausadoEm){J.pausa+=Date.now()-J.pausadoEm;J.pausadoEm=null}else J.pausadoEm=Date.now();save();render()}
function encerrarPartida(){const A=S.atual,a=placar(0),b=placar(1),[t1,t2]=A.quadra;
  if(a===b){abrirEmpate();return}const i=a>b?0:1;
  confirmar(`<b>Time ${A.quadra[i].num} venceu</b> por ${Math.max(a,b)} x ${Math.min(a,b)}?`,()=>vencer(i),'Confirmar resultado')}
function cancelarPartida(){confirmar('Cancelar esta partida? O cronômetro e os lances marcados nela serão descartados.',()=>{snap();S.atual.jogo=null;sync()},'Cancelar partida',true)}
const chip=(l,on,fn)=>`<button class="chip ${on?'on':''}" onclick="${fn}">${esc(l)}</button>`;
function evSet(k,v){const E=ui.ev,t=S.atual.quadra[E.i];E[k]=v;
  if(k==='estilo'&&E.tipo==='gol'){E.id=null;E.assist=''}
  if(k==='tipo'){E.estilo=v==='defesa'?'Defesa':null;E.id=v==='defesa'?t.gol:null;E.susp=null}
  if(k==='id'&&E.assist===v)E.assist='';
  (E.tipo==='gol'?modalGol:modalLance)()}
function abrirGol(i){ui.ev={tipo:'gol',i,estilo:'Normal',id:null,assist:''};modalGol()}
function modalGol(){const A=S.atual,E=ui.ev,t=A.quadra[E.i],o=A.quadra[1-E.i],contra=E.estilo==='Contra';
  const autores=contra?idsTime(o):idsTime(t),assist=idsTime(t).filter(x=>x!==E.id);
  abre(`<h2>⚽ Gol do Time ${t.num} <span class=muted style="font-weight:400">· ${fmtT(tempoJogo())}</span></h2>
  <div class=muted>Tipo de gol</div><div class=chips>${ESTILOS_GOL.map(x=>chip(x,E.estilo===x,`evSet('estilo','${x}')`)).join('')}</div>
  <div class=muted>${contra?`Quem fez contra (Time ${o.num})`:'Quem fez o gol'}</div><div class=chips>${autores.map(id=>chip(nomeJ(id),E.id===id,`evSet('id','${id}')`)).join('')}</div>
  ${contra?'':`<div class=muted>Assistência</div><div class=chips>${chip('Sem assistência',!E.assist,`evSet('assist','')`)}${assist.map(id=>chip(nomeJ(id),E.assist===id,`evSet('assist','${id}')`)).join('')}</div>`}
  <div class=gap><button class=btn onclick="registrarEv()" ${E.id?'':'disabled'}>Marcar gol</button><button class="btn ghost" onclick="fecha()">Cancelar</button></div>`)}
function abrirLance(i){ui.ev={tipo:'defesa',i,estilo:'Defesa',id:S.atual.quadra[i].gol||null};modalLance()}
function modalLance(){const A=S.atual,E=ui.ev,t=A.quadra[E.i];
  const tipos=[['defesa','🧤 Defesa'],['desarme','🛡️ Desarme'],['amarelo','🟨 Amarelo'],['vermelho','🟥 Vermelho'],['saiu','🔁 Saiu / machucou']];
  if(E.tipo==='vermelho'&&E.susp==null){E.susp=+S.config.suspVermelho||1;E.sai=true}
  const lista=E.tipo==='desarme'?t.jog.map(p=>p.id):idsTime(t);
  const lbl={defesa:'Quem defendeu',desarme:'Quem desarmou',saiu:'Quem saiu',amarelo:'Quem levou',vermelho:'Quem levou'}[E.tipo];
  const btn={defesa:'Marcar defesa',desarme:'Marcar desarme',saiu:'Confirmar saída',amarelo:'Dar amarelo · '+brl(S.config.valorAmarelo),vermelho:'Dar vermelho · '+brl(S.config.valorVermelho)}[E.tipo];
  const R=A.reservas||[],gk=E.id&&E.id===t.gol;
  abre(`<h2>Lance do Time ${t.num} <span class=muted style="font-weight:400">· ${fmtT(tempoJogo())}</span></h2>
  <div class=chips>${tipos.map(([k,l])=>chip(l,E.tipo===k,`evSet('tipo','${k}')`)).join('')}</div>
  ${E.tipo==='defesa'?`<div class=muted>Tipo de defesa</div><div class=chips>${ESTILOS_DEF.map(x=>chip(x,E.estilo===x,`evSet('estilo','${x}')`)).join('')}</div>`:''}
  <div class=muted>${lbl}</div><div class=chips>${lista.map(id=>chip((id===t.gol?'🧤 ':'')+nomeJ(id),E.id===id,`evSet('id','${id}')`)).join('')}</div>
  ${E.tipo==='vermelho'?`<div class=muted>Suspensão</div><div class=chips>${[0,1,2,3,4,5].map(n=>chip(n?n+' baba'+(n>1?'s':''):'Sem suspensão',E.susp===n,`evSet('susp',${n})`)).join('')}</div>
   <div class=muted>Sai do baba de hoje?</div><div class=chips>${chip('Sim (entra o jogador da vez)',E.sai,`evSet('sai',true)`)}${chip('Não',!E.sai,`evSet('sai',false)`)}</div>`:''}
  ${E.tipo==='saiu'?`<p class=muted style="margin-top:0">${gk?'Entra o próximo goleiro da fila.':R.length?'Entra o jogador da vez (ou escolha um reserva abaixo, se ele deu a vaga).':'Entra o jogador da vez: o primeiro do próximo time da fila.'}</p>
   ${R.length&&!gk&&E.id?`<div class=muted>Deu a vaga para um reserva?</div><div class=chips>${chip('Não, entra o da vez',!E.reserva,`evSet('reserva','')`)}${R.map(r=>chip(nomeJ(r),E.reserva===r,`evSet('reserva','${r}')`)).join('')}</div>`:''}`:''}
  <div class=gap><button class="btn ${E.tipo==='saiu'||E.tipo==='vermelho'?'red':''}" onclick="registrarEv()" ${E.id?'':'disabled'}>${btn}</button><button class="btn ghost" onclick="fecha()">Cancelar</button></div>`)}
function registrarEv(){const A=S.atual,E=ui.ev,J=A.jogo,t=A.quadra[E.i];if(!E.id||!J)return;
  snap();const ev={tipo:E.tipo,time:t.num,id:E.id,s:tempoJogo()};
  if(E.tipo==='gol'){ev.estilo=E.estilo;if(E.assist&&E.estilo!=='Contra')ev.assist=E.assist}
  if(E.tipo==='defesa')ev.estilo=E.estilo;
  if(E.tipo==='amarelo'||E.tipo==='vermelho'){const c=criaCartao(E.id,E.tipo,E.susp||0,'jogo');ev.cartaoId=c.id;if(E.tipo==='vermelho')ev.susp=E.susp||0}
  J.eventos.push(ev);
  if(E.tipo==='vermelho'&&E.sai){const antes=new Set(idsTime(t));if(E.id===t.gol)removerDoBaba(E.id,true);else sairComVez(E.id,true);
    const novo=idsTime(t).find(x=>!antes.has(x));if(novo)ev.entrou=novo;save();render();toast(`🟥 ${nomeJ(E.id)} expulso${novo?' · entrou '+nomeJ(novo):''}`);return}
  if(E.tipo==='saiu'){const antes=new Set(idsTime(t));
    if(E.reserva&&E.id!==t.gol){const p=t.jog.find(p=>p.id===E.id);if(p)p.id=E.reserva;A.reservas=A.reservas.filter(x=>x!==E.reserva);fecha();sync()}
    else if(E.id===t.gol)removerDoBaba(E.id,true);else sairComVez(E.id,true);
    const novo=idsTime(t).find(x=>!antes.has(x));if(novo)ev.entrou=novo;save();render();
    toast(`${nomeJ(E.id)} saiu${novo?' · entrou '+nomeJ(novo):''}`);return}
  fecha();sync();toast(E.tipo==='gol'?`⚽ Gol de ${nomeJ(E.id)}!`:E.tipo==='amarelo'?`🟨 Amarelo para ${nomeJ(E.id)}`:E.tipo==='vermelho'?`🟥 Vermelho para ${nomeJ(E.id)}`:'Lance marcado')}
function textoEv(e){const n=x=>esc(nomeJ(x));
  if(e.tipo==='gol')return`⚽ <b>${n(e.id)}</b>${e.estilo&&e.estilo!=='Normal'?` <span class="tag yel">${e.estilo==='Contra'?'gol contra':esc(e.estilo.toLowerCase())}</span>`:''}${e.assist?` <span class=muted>· assist. ${n(e.assist)}</span>`:''}`;
  if(e.tipo==='defesa')return`🧤 ${e.estilo==='Defesa'?'Defesa':esc(e.estilo)} de <b>${n(e.id)}</b>`;
  if(e.tipo==='desarme')return`🛡️ Desarme de <b>${n(e.id)}</b>`;
  if(e.tipo==='amarelo')return`🟨 Amarelo para <b>${n(e.id)}</b>`;
  if(e.tipo==='vermelho')return`🟥 Vermelho para <b>${n(e.id)}</b>${e.susp?` <span class=muted>· ${e.susp} baba${e.susp>1?'s':''} de suspensão</span>`:''}${e.entrou?` <span class=muted>· entrou ${n(e.entrou)}</span>`:''}`;
  if(e.tipo==='saiu')return`🔁 <b>${n(e.id)}</b> saiu${e.entrou?` · entrou ${n(e.entrou)}`:''}`;return''}
function tirarEv(k){confirmar('Apagar este lance?',()=>{snap();S.atual.jogo.eventos.splice(k,1);sync()},'Apagar',true)}
function desfazer(){const A=S.atual;if(!A.hist.length)return;const prev=JSON.parse(A.hist.pop());prev.hist=A.hist;S.atual=prev;sync();toast('Desfeito')}
function chegou(id){const A=S.atual,j=getJ(id);if(bloqueado(j)){toast(msgBloq(j));return}
  snap();A.presentes.push(id);
  if(j.pos==='goleiro')A.filaGol.push(id);
  let msg=j.nome+' entrou no baba';if(!A.reservas)A.reservas=[];
  if(j.pos!=='goleiro'){const inc=ultimoIncompleto();
    if(inc){inc.jog.push({id,seq:A.seqNext++});msg=`${j.nome} completou o Time ${inc.num}`}
    else if(ui.passouTol){A.reservas.push(id);msg=`${j.nome} ficou na reserva (times completos)`}
    else{A.fila.push({num:A.prox++,jog:[{id,seq:A.seqNext++}],gol:null});msg=`${j.nome} abriu o Time ${A.prox-1}`}}
  entra();fecha();sync();toast(msg)}
// jogador sai/machuca: o jogador da vez (1º do time de trás) sobe e a numeração anda uma casa
function sairComVez(id,noSnap){const A=S.atual;if(!A.reservas)A.reservas=[];
  let team=null,idx=-1,naQuadra=false;
  A.quadra.forEach(t=>{const i=t.jog.findIndex(p=>p.id===id);if(i>=0){team=t;idx=i;naQuadra=true}});
  A.fila.forEach(t=>{const i=t.jog.findIndex(p=>p.id===id);if(i>=0){team=t;idx=i}});
  if(!team){removerDoBaba(id,noSnap);return}
  if(!noSnap)snap();
  const cadeia=[team,...(naQuadra?A.fila:A.fila.slice(A.fila.indexOf(team)+1))];
  const antes=team.jog.slice(0,idx);
  const tam=cadeia.map((t,i)=>i===0?t.jog.length-idx:t.jog.length);
  const velho=[...team.jog.slice(idx),...cadeia.slice(1).flatMap(t=>t.jog)];
  let nova=velho.slice(1);if(A.reservas.length)nova.push({id:A.reservas.shift()});else if(cadeia.length>1||!naQuadra)A.seqNext=Math.max(1,A.seqNext-1);
  nova=nova.map((p,i)=>({id:p.id,seq:velho[i].seq}));
  const subiu=nova[idx===team.jog.length-1?0:tam[0]-1];
  let q=0;cadeia.forEach((t,i)=>{const pega=nova.slice(q,q+tam[i]);q+=tam[i];t.jog=i===0?antes.concat(pega):pega});
  A.quadra=A.quadra.filter(t=>t.jog.length);A.fila=A.fila.filter(t=>t.jog.length);
  entra();fecha();sync();
  toast(cadeia.length>1||subiu?`${nomeJ(id)} saiu. Entrou o jogador da vez.`:`${nomeJ(id)} saiu.`)}
function darVaga(id,rid){const A=S.atual;snap();for(const t of[...A.quadra,...A.fila]){const p=t.jog.find(p=>p.id===id);if(p)p.id=rid}
  A.reservas=A.reservas.filter(x=>x!==rid);fecha();sync();toast(`${nomeJ(rid)} entrou no lugar de ${nomeJ(id)}`)}
function atrasadoAgora(){const b=babaAtual();if(!b)return false;const d=diaDe(b.data);const h=d==='ter'?S.config.horaTer:d==='sab'?S.config.horaSab:null;
  if(!h||!/^\d{2}:\d{2}$/.test(h))return false;return Date.now()>new Date(b.data+'T'+h+':00').getTime()+(+S.config.tolerancia||0)*60000}
function removerDoBaba(id,noSnap){const A=S.atual;if(!noSnap)snap();A.filaGol=A.filaGol.filter(x=>x!==id);A.reservas=(A.reservas||[]).filter(x=>x!==id);
  for(const t of[...A.quadra,...A.fila]){if(t.gol===id)t.gol=null;t.jog=t.jog.filter(p=>p.id!==id)}
  const vazios=[...A.quadra,...A.fila].filter(t=>!t.jog.length);vazios.forEach(t=>{if(t.gol)A.filaGol.unshift(t.gol)});
  A.quadra=A.quadra.filter(t=>t.jog.length);A.fila=A.fila.filter(t=>t.jog.length);entra();fecha();sync()}

let tab='baba';
const ui={mesMens:mesAtual(),mesCaixa:mesAtual(),mesFreq:mesAtual(),filtroMens:'todos',filtroJog:'todos',busca:'',buscaJ:'',
  sel:new Set(),golOrdem:[],dataBaba:hoje(),balancear:true,porTime:+S.config.porTime||5,mais:'menu',rec:null};
let _cb=null;
function toast(t){if(!temDOM)return;const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2300)}
function abre(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.remove('hidden')}
function fecha(){if(temDOM)document.getElementById('modal').classList.add('hidden')}
function confirmar(msg,cb,txt,red){_cb=cb;abre(`<h2>Confirmar</h2><p>${msg}</p><div class=gap><button class="btn ${red?'red':''}" onclick="fecha();_cb&&_cb()">${txt||'Confirmar'}</button><button class="btn ghost" onclick="fecha()">Cancelar</button></div>`)}
function go(t){tab=t;if(t==='mais')ui.mais='menu';window.scrollTo(0,0);render()}
function mhead(m,key){return`<div class=mhead><button onclick="ui.${key}=addMes(ui.${key},-1);render()">‹</button><b>${nomeMes(m)}</b><button onclick="ui.${key}=addMes(ui.${key},1);render()">›</button></div>`}
function filtrar(q){const s=norm(q);document.querySelectorAll('[data-n]').forEach(e=>e.style.display=e.dataset.n.includes(s)?'':'none')}
function compartilhar(txt){if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast('Copiado! Cole no WhatsApp.'),()=>mostraTexto(txt))}else mostraTexto(txt)}
function mostraTexto(t){abre(`<h2>Copie o texto</h2><textarea rows=12>${esc(t)}</textarea><button class="btn block" style="margin-top:10px" onclick="fecha()">Fechar</button>`)}
function avisos(){let h='';if(!salvaOk)h+=`<div class=warn><b>Atenção:</b> este navegador não está conseguindo salvar os dados. Faça backup em <b>Mais › Backup</b> antes de fechar.</div>`;
  const ub=S.config.ultimoBackup;const dias=ub?Math.floor((Date.now()-new Date(ub))/864e5):null;
  if(!restrito()&&S.jogadores.length&&(dias===null||dias>=7)&&!(tab==='baba'&&S.atual))h+=`<div class=warn>💾 ${dias===null?'Você ainda não fez nenhum backup.':`Último backup há ${dias} dias.`} Os dados ficam só neste aparelho. <a href="#" onclick="go('mais');return false" style="color:inherit;font-weight:700">Fazer backup</a></div>`;
  return h}
function render(){if(!temDOM)return;const y=window.scrollY;
  if(restrito()&&!['baba','mens','mais'].includes(tab))tab='baba';
  {const bm=document.querySelector('#nav button[data-t=mens]');if(bm)bm.lastChild.textContent=restrito()?'Receber':'Mensalidades'}
  document.querySelectorAll('#nav button').forEach(b=>b.style.display=restrito()&&!['baba','mens','mais'].includes(b.dataset.t)?'none':'');
  const f={baba:rBaba,jog:rJog,mens:()=>restrito()?rReceber():rMens(),caixa:rCaixa,mais:rMais}[tab];
  document.getElementById('app').innerHTML=avisos()+f();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  document.getElementById('topinfo').innerHTML=S.atual?'⚽ Baba em andamento':restrito()?'Modo sorteio · offline':'Offline · salvo no aparelho';
  window.scrollTo(0,y);
  if(tab==='baba'&&!S.atual&&ui.busca)filtrar(ui.busca);
  if(tab==='jog'&&ui.buscaJ)filtrar(ui.buscaJ)}

/* ----- cartões ----- */
const COR={amarelo:'🟨',vermelho:'🟥'};
function babasDepois(c){if(restrito()){const t=S.pacoteEm?new Date(S.pacoteEm).getTime():0;return(+c.cumpridas||0)+S.babas.filter(b=>b.data>c.data&&(c.local||(b.criado||0)>t)).length}
  return S.babas.filter(b=>b.data>c.data).length}
const suspRest=c=>Math.max(0,(+c.susp||0)-babasDepois(c));
const cartoesAbertos=j=>S.cartoes.filter(c=>c.jogId===j.id&&!c.cancelado&&(!c.pago||suspRest(c)>0));
const bloqueado=j=>emAtraso(j).length>0||cartoesAbertos(j).length>0;
function tagsCartao(j){return cartoesAbertos(j).map(c=>{const r=suspRest(c);return`<span class="tag red">${COR[c.tipo]} ${r?`Suspenso: falta${r>1?'m':''} ${r} baba${r>1?'s':''}`:''}${r&&!c.pago?' · ':''}${!c.pago?(restrito()?'cartão a pagar':'a pagar '+brl(c.valor)):''}</span>`}).join('')}
function msgBloq(j){if(cartoesAbertos(j).some(c=>suspRest(c)>0))return'Jogador suspenso por cartão vermelho.';if(cartoesAbertos(j).length)return'Cartão em aberto: só joga depois de pagar.';
  return restrito()?'Em atraso. Se pagou agora, toque em "Pagou agora" para liberar.':'Mensalidade em atraso. Toque em "Receber" para liberar.'}
function btnBloq(j,ctx){if(emAtraso(j).length)return btnReceber(j,ctx);const c=cartoesAbertos(j).find(c=>!c.pago);
  return c?`<button class="btn sm" onclick="event.stopPropagation();abrirCartaoPag('${c.id}','${ctx}')">${restrito()?'Pagou agora':'Receber'}</button>`:''}
function criaCartao(jid,tipo,susp,origem){const c={id:uid(),jogId:jid,tipo,data:(babaAtual()||{}).data||hoje(),babaId:S.atual?S.atual.babaId:null,
  valor:tipo==='vermelho'?+S.config.valorVermelho:+S.config.valorAmarelo,susp:tipo==='vermelho'?+susp:0,pago:false,origem,local:restrito()||undefined};S.cartoes.push(c);return c}
function limpaCartoes(){const A=S.atual;if(!A)return;const refs=new Set();[...(A.jogo?A.jogo.eventos:[]),...A.log.flatMap(p=>p.ev||[])].forEach(e=>{if(e.cartaoId)refs.add(e.cartaoId)});
  S.cartoes=S.cartoes.filter(c=>!(c.babaId===A.babaId&&c.origem==='jogo'&&!c.pago&&!refs.has(c.id)))}
function abrirCartao(jid,tipo){ui.ct={jid,tipo:tipo||'amarelo',susp:+S.config.suspVermelho||1,sai:true};modalCartao()}
function modalCartao(){const C=ui.ct,j=getJ(C.jid),c=S.config,noJogo=S.atual&&idsTime&&[...S.atual.quadra,...S.atual.fila].some(t=>idsTime(t).includes(C.jid));
  abre(`<h2>Cartão para ${esc(j.nome)}</h2><div class=chips>${chip('🟨 Amarelo · '+brl(c.valorAmarelo),C.tipo==='amarelo',`ui.ct.tipo='amarelo';modalCartao()`)}${chip('🟥 Vermelho · '+brl(c.valorVermelho),C.tipo==='vermelho',`ui.ct.tipo='vermelho';modalCartao()`)}</div>
  ${C.tipo==='vermelho'?`<div class=muted>Suspensão (babas sem jogar)</div><div class=chips>${[0,1,2,3,4,5].map(n=>chip(n?n+' baba'+(n>1?'s':''):'Sem suspensão',C.susp===n,`ui.ct.susp=${n};modalCartao()`)).join('')}</div>
   ${noJogo?`<div class=muted>Sai do baba de hoje?</div><div class=chips>${chip('Sim, sai (entra o jogador da vez)',C.sai,`ui.ct.sai=true;modalCartao()`)}${chip('Não',!C.sai,`ui.ct.sai=false;modalCartao()`)}</div>`:''}`:''}
  <p class=muted>Enquanto ${C.tipo==='vermelho'&&C.susp?'cumprir a suspensão ou ':''}não pagar o cartão, ele não entra no sorteio, mesmo com a mensalidade em dia.</p>
  <div class=gap><button class="btn ${C.tipo==='vermelho'?'red':''}" onclick="confirmarCartao()">Aplicar cartão</button><button class="btn ghost" onclick="fecha()">Cancelar</button></div>`)}
function confirmarCartao(){const C=ui.ct,j=getJ(C.jid);criaCartao(C.jid,C.tipo,C.susp,'manual');save();
  const noJogo=S.atual&&[...S.atual.quadra,...S.atual.fila].some(t=>idsTime(t).includes(C.jid));
  if(C.tipo==='vermelho'&&C.sai&&noJogo){j.pos==='goleiro'?removerDoBaba(C.jid):sairComVez(C.jid)}else{fecha();render()}
  toast(`${COR[C.tipo]} Cartão ${C.tipo} para ${j.nome}`)}
function abrirCartaoPag(cid,ctx){const c=S.cartoes.find(x=>x.id===cid),j=getJ(c.jogId)||{nome:'?'};const r=suspRest(c);ui.ctp={cid,ctx};
  abre(`<h2>${COR[c.tipo]} Cartão ${c.tipo}</h2><p style="margin-top:0"><b>${esc(j.nome)}</b> · ${fmtData(c.data)}</p>
  ${c.tipo==='vermelho'?`<p>${r?`<span class="tag red">Suspenso: falta${r>1?'m':''} ${r} baba${r>1?'s':''}</span>`:`<span class="tag grn">Suspensão cumprida</span>`} <span class=muted>(${c.susp} no total)</span></p>
   ${restrito()?'':`<div class=muted>Alterar suspensão (decisão da diretoria)</div><div class=chips>${[0,1,2,3,4,5,6].map(n=>chip(String(n),+c.susp===n,`ajustaSusp('${cid}',${n})`)).join('')}</div>`}`:''}
  ${c.pago?`<p><span class="tag grn">Pago</span> ${brl(c.valor)}</p>`:`<label>Valor recebido (R$)<input id=ctv type=number inputmode=decimal step="0.01" value="${c.valor}"></label>${restrito()?campoQuem():''}`}
  <div class=gap>${c.pago?'':`<button class=btn onclick="pagarCartao()">${restrito()?'Recebi, registrar':'Receber'}</button>`}
  ${restrito()?'':`${c.pago?`<button class="btn ghost" onclick="estornarCartao('${cid}')">Estornar pagamento</button>`:''}<button class="btn red" onclick="cancelarCartao('${cid}')">Cancelar cartão</button>`}<button class="btn ghost" onclick="fecha()">Fechar</button></div>`)}
function ajustaSusp(cid,n){const c=S.cartoes.find(x=>x.id===cid);c.susp=n;save();abrirCartaoPag(cid,ui.ctp.ctx);render()}
function pagarCartao(){const{cid,ctx}=ui.ctp,c=S.cartoes.find(x=>x.id===cid),j=getJ(c.jogId);const v=parseFloat(document.getElementById('ctv').value)||0;
  if(restrito()){const q=document.getElementById('rrq').value.trim();if(!q){toast('Informe quem recebeu');return}S.config.meuNome=q;S.recebidos.push({id:uid(),tipo:'cartao',cartaoId:cid,cartao:{...c},jogId:c.jogId,nome:j.nome,valor:v,data:hoje(),quem:q})}
  else S.lanc.push({id:uid(),tipo:'e',cat:'Cartões',desc:`Cartão ${c.tipo} — ${j.nome} (${fmtData(c.data).slice(0,5)})`,valor:v,data:hoje(),jogId:c.jogId,cartaoId:cid});
  c.pago=true;save();fecha();toast(`Cartão pago${suspRest(c)?' · ainda cumpre suspensão':''}`);
  if(!bloqueado(j)){if(ctx==='chegou'&&S.atual){chegou(j.id);return}if(ctx==='presenca'){if(j.pos==='goleiro'){if(!ui.golOrdem.includes(j.id))ui.golOrdem.push(j.id)}else ui.sel.add(j.id)}}
  render()}
function estornarCartao(cid){confirmar('Estornar o pagamento deste cartão?',()=>{const c=S.cartoes.find(x=>x.id===cid);c.pago=false;S.lanc=S.lanc.filter(l=>l.cartaoId!==cid);save();render()},'Estornar',true)}
function cancelarCartao(cid){confirmar('Cancelar este cartão? Ele deixa de valer (sem multa e sem suspensão).',()=>{const c=S.cartoes.find(x=>x.id===cid);c.cancelado=true;S.lanc=S.lanc.filter(l=>l.cartaoId!==cid);save();render()},'Cancelar cartão',true)}

/* ----- 2 meses sem pagar ----- */
const doisMeses=()=>restrito()?[]:S.jogadores.filter(j=>cobravel(j)&&emAtraso(j).length>=2).sort(byNome);
function cardDoisMeses(){const L=doisMeses();if(!L.length)return'';
  return`<div class=card style="border-color:var(--r)"><h3 style="margin-bottom:4px;color:#ff7a7a">⚠️ 2 meses sem pagar</h3><p class=muted style="margin:0 0 6px">Pela regra, esses sócios devem ser notificados. Se não regularizarem, são desligados do grupo.</p>
  ${L.map(j=>{const a=emAtraso(j);return`<div class=it style="display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer" onclick="abrirDoisMeses('${j.id}')"><div class=grow><b>${esc(j.nome)}</b><div class=muted>${a.map(m=>nomeMes(m).slice(0,3)).join(', ')} · ${brl(a.length*valorPlano(j))}</div></div>${j.notificado?`<span class="tag yel">Notificado ${fmtData(j.notificado).slice(0,5)}</span>`:'<span class="tag red">Notificar</span>'}</div>`}).join('')}</div>`}
function abrirDoisMeses(id){const j=getJ(id),a=emAtraso(j);
  abre(`<h2>${esc(j.nome)}</h2><p style="margin-top:0">${a.length} meses sem pagar: ${a.map(m=>nomeMes(m)).join(', ')} · <b>${brl(a.length*valorPlano(j))}</b></p>
  ${j.notificado?`<p><span class="tag yel">Notificado em ${fmtData(j.notificado)}</span></p>`:''}
  <div class=gap style="flex-direction:column;align-items:stretch">
   <button class=btn onclick="msgDoisMeses('${id}')">Mandar mensagem de notificação</button>
   <button class="btn sec" onclick="marcarNotificado('${id}')">${j.notificado?'Atualizar data da notificação (hoje)':'Marcar como notificado hoje'}</button>
   <button class="btn sec" onclick="fecha();abrirReceber('${id}')">Ele pagou: receber</button>
   <button class="btn red" onclick="desligar('${id}')">Não regularizou: desligar do grupo</button>
   <button class="btn ghost" onclick="fecha()">Fechar</button></div>`)}
function msgDoisMeses(id){const j=getJ(id),a=emAtraso(j);
  compartilhar(`Olá, ${j.nome}! Aqui é da diretoria da ACP ⚽\n\nConsta em aberto a sua mensalidade de ${a.map(m=>nomeMes(m)).join(' e ')}, total de ${brl(a.length*valorPlano(j))}.\n\nPela regra da associação, sócio com 2 meses sem pagar é desligado do grupo. Conseguimos regularizar? Qualquer dúvida, é só falar com a gente.\n\nDiretoria ACP · Deu Baba`);
  if(!j.notificado){j.notificado=hoje();save();render()}}
function marcarNotificado(id){getJ(id).notificado=hoje();save();fecha();render();toast('Marcado como notificado')}
function desligar(id){const j=getJ(id);confirmar(`Desligar <b>${esc(j.nome)}</b> do grupo? Ele fica inativo: sai das cobranças e do sorteio. O histórico continua guardado e dá para reativar no cadastro.`,()=>{j.ativo=false;j.desligadoEm=hoje();ui.sel.delete(id);save();render();toast(j.nome+' desligado')},'Desligar',true)}

/* ----- convidados ----- */
const socios=()=>S.jogadores.filter(j=>!j.convidado);
function txtAtraso(j,atr){if(j.convidado)return`Diária pendente${restrito()?'':' · '+brl(S.lanc&&S.pendConv.filter(p=>p.jogId===j.id&&p.data<hoje()).reduce((t,p)=>t+ +p.valor,0))}`;
  return`Em atraso: ${atr.length} ${atr.length>1?'meses':'mês'}${restrito()?'':' · '+brl(atr.length*valorPlano(j))}`}
function registrarDiaria(j,pago,data){const b=babaAtual();if(b){b.conv=b.conv||{};b.conv[j.id]={nome:j.nome,pago}}
  if(restrito())return;const v=+S.config.valorConvidado;
  if(pago)S.lanc.push({id:uid(),tipo:'e',cat:'Convidado',desc:`Convidado — ${j.nome} (${fmtData(data).slice(0,5)})`,valor:v,data,jogId:j.id});
  else S.pendConv.push({id:uid(),jogId:j.id,data,valor:v})}
function abrirConvidado(ctx){ui.cv={ctx,id:null,pago:true,gol:false};modalConv()}
function modalConv(){const C=ui.cv,v=+S.config.valorConvidado;const A=S.atual;
  const ja=new Set(C.ctx==='chegou'?A.presentes:[...ui.sel,...ui.golOrdem]);
  const ant=S.jogadores.filter(j=>j.convidado&&!ja.has(j.id)).sort(byNome);const sel=C.id&&getJ(C.id);const pend=sel?emAtraso(sel):[];
  abre(`<h2>Convidado</h2><p class=muted style="margin-top:0">Convidado paga ${brl(v)} por baba.</p>
  ${ant.length?`<div class=muted>Já veio antes</div><div class=chips>${ant.map(j=>chip(j.nome,C.id===j.id,`ui.cv.id='${j.id}';ui.cv.gol=getJ('${j.id}').pos==='goleiro';modalConv()`)).join('')}</div>`:''}
  ${sel?'':`<label>${ant.length?'Ou novo convidado':'Nome do convidado'}<input id=cvn placeholder="Ex.: Primo do Zé"></label>`}
  <div class=chips>${chip('Linha',!C.gol,`ui.cv.gol=false;modalConv()`)}${chip('Goleiro',C.gol,`ui.cv.gol=true;modalConv()`)}</div>
  ${pend.length?`<div class=warn style="margin-bottom:10px">Tem ${pend.length} diária${pend.length>1?'s':''} pendente${pend.length>1?'s':''} (${pend.map(d=>fmtData(d).slice(0,5)).join(', ')}). Só joga se acertar${restrito()?'.':': ao marcar "Pagou agora", as pendentes também são quitadas'}.${restrito()?`<br><button class="btn sm" style="margin-top:8px" onclick="abrirReceberR('${sel.id}','')">Pagou agora, liberar</button>`:''}</div>`:''}
  ${restrito()?'':`<div class=muted>Diária de hoje (${brl(v)})</div><div class=chips>${chip('Pagou agora',C.pago,`ui.cv.pago=true;modalConv()`)}${chip('Paga depois',!C.pago,`ui.cv.pago=false;modalConv()`)}</div>`}
  ${restrito()?`<div class=muted>Recebeu a diária de ${brl(v)}?</div><div class=chips>${chip('Sim',C.pago,`ui.cv.pago=true;modalConv()`)}${chip('Ainda não',!C.pago,`ui.cv.pago=false;modalConv()`)}</div>`:''}
  <div class=gap><button class=btn onclick="confirmarConv()">Adicionar ao baba</button>${sel?`<button class="btn ghost" onclick="ui.cv.id=null;modalConv()">Outro nome</button>`:''}<button class="btn ghost" onclick="fecha()">Cancelar</button></div>`);
  setTimeout(()=>{const e=document.getElementById('cvn');if(e)e.focus()},50)}
function confirmarConv(){const C=ui.cv;let j=C.id&&getJ(C.id);
  if(!j){const n=(document.getElementById('cvn')||{}).value;const nome=(n||'').trim();if(!nome){toast('Digite o nome ou escolha um convidado');return}
    j=S.jogadores.find(x=>x.convidado&&norm(x.nome)===norm(nome));
    if(!j){j={id:uid(),nome,convidado:true,pos:'linha',posicao:'',plano:'sab',ativo:true,isento:false,notas:{},inicio:mesAtual()};S.jogadores.push(j)}}
  j.pos=C.gol?'goleiro':'linha';if(C.gol)j.posicao='Goleiro';else if(norm(j.posicao)==='goleiro')j.posicao='';
  const pend=emAtraso(j);
  if(pend.length&&(!C.pago||restrito())){toast('Diária pendente: só joga depois de acertar.');return}
  if(cartoesAbertos(j).length){toast(msgBloq(j));return}
  if(pend.length&&C.pago){const ps=S.pendConv.filter(p=>p.jogId===j.id&&p.data<hoje());ps.forEach(p=>S.lanc.push({id:uid(),tipo:'e',cat:'Convidado',desc:`Convidado — ${j.nome} (${fmtData(p.data).slice(0,5)})`,valor:p.valor,data:hoje(),jogId:j.id}));S.pendConv=S.pendConv.filter(p=>!ps.includes(p))}
  if(C.ctx==='chegou'){registrarDiaria(j,C.pago,(babaAtual()||{}).data||hoje());save();chegou(j.id);return}
  ui.conv=ui.conv||{};ui.conv[j.id]=C.pago;if(j.pos==='goleiro'){if(!ui.golOrdem.includes(j.id))ui.golOrdem.push(j.id)}else ui.sel.add(j.id);
  save();fecha();render();toast(`${j.nome} entrou como convidado`)}
function btnReceber(j,ctx){const fn=j.convidado?(restrito()?`abrirReceberR('${j.id}','${ctx}')`:`abrirReceberConv('${j.id}')`):(restrito()?`abrirReceberR('${j.id}','${ctx}')`:`abrirReceber('${j.id}',null,'${ctx}')`);
  return`<button class="btn sm" onclick="event.stopPropagation();${fn}">${restrito()?'Pagou agora':'Receber'}</button>`}
function abrirReceberR(id,ctx){const j=getJ(id),c=S.config;ui.recR={id,ctx};
  if(j.convidado){const v=+c.valorConvidado||10;
    abre(`<h2>Liberar ${esc(j.nome)}</h2><p>Convidado com diária pendente. Receba <b style="color:var(--neon)">${brl(v)}</b> (ou o que ele devia) para liberar.</p>
    <label>Valor recebido (R$)<input id=rrv type=number inputmode=decimal step="0.01" value="${v}"></label>${campoQuem()}
    <div class=gap><button class=btn onclick="confirmarReceberR()">Recebi, liberar</button><button class="btn ghost" onclick="fecha()">Cancelar</button></div>`);return}
  const cur=mesAtual();let ms=[],m=j.pagoAte?addMes(j.pagoAte,1):cur,g=0;while(m<=addMes(cur,1)&&g++<36){ms.push(m);m=addMes(m,1)}
  const val=j.plano==='ambos'?+c.valorDois:+c.valorUm;
  abre(`<h2>Liberar ${esc(j.nome)}</h2><p class=muted style="margin-top:0">${DIAS[j.plano]}${val?' · '+brl(val)+'/mês':''}. Marque os meses que ele pagou agora.</p>
  <div id=rrMeses>${ms.map(x=>`<label class=ck><input type=checkbox value="${x}" ${vencido(x)?'checked':''} onchange="rrTotal()"><span class=grow>${nomeMes(x)}</span>${vencido(x)?'<span class="tag red">atrasado</span>':x>cur?'<span class="tag gray">adiantado</span>':''}</label>`).join('')}</div>
  <label style="margin-top:10px">Valor por mês (R$)<input id=rrv type=number inputmode=decimal step="0.01" value="${val||''}" oninput="rrTotal()"></label>
  <div class=row style="margin:0 0 12px"><span class=grow>Total recebido</span><b id=rrTot style="font-size:18px"></b></div>${campoQuem()}
  <p class=muted>O pagamento vai para o diretor financeiro junto com os babas, quando você tocar em "Enviar babas".</p>
  <div class=gap><button class=btn onclick="confirmarReceberR()">Recebi, liberar</button><button class="btn ghost" onclick="fecha()">Cancelar</button></div>`);rrTotal()}
function campoQuem(){const ds=S.jogadores.filter(j=>j.diretor&&j.ativo).sort(byNome),eu=S.config.meuNome||'';
  if(!ds.length)return`<label>Quem recebeu o dinheiro<input id=rrq value="${esc(eu)}" placeholder="Seu nome"></label>`;
  const naLista=ds.some(d=>d.nome===eu);
  return`<label>Quem recebeu o dinheiro<select id=rrqs onchange="const i=document.getElementById('rrq');if(this.value==='__o'){i.style.display='';i.value='';i.focus()}else{i.style.display='none';i.value=this.value}">
   <option value="" ${!eu?'selected':''} disabled>Escolha seu nome</option>${ds.map(d=>`<option ${d.nome===eu?'selected':''}>${esc(d.nome)}</option>`).join('')}<option value="__o" ${eu&&!naLista?'selected':''}>Outro…</option></select>
   <input id=rrq value="${esc(eu)}" placeholder="Seu nome" style="margin-top:6px;${eu&&!naLista?'':'display:none'}"></label>`}
function rrTotal(){const e=document.getElementById('rrTot');if(!e)return;const n=document.querySelectorAll('#rrMeses input:checked').length;e.textContent=brl(n*(parseFloat(document.getElementById('rrv').value)||0))}
function confirmarReceberR(){const{id,ctx}=ui.recR,j=getJ(id);const quem=document.getElementById('rrq').value.trim();if(!quem){toast('Informe quem recebeu');return}
  S.config.meuNome=quem;const v=parseFloat(document.getElementById('rrv').value)||0;
  if(j.convidado){S.recebidos.push({id:uid(),tipo:'convidado',jogId:id,nome:j.nome,valor:v,data:hoje(),quem});j.devendo=false}
  else{const chk=[...document.querySelectorAll('#rrMeses input:checked')].map(i=>i.value);if(!chk.length){toast('Marque pelo menos um mês');return}
    let m=j.pagoAte?addMes(j.pagoAte,1):chk[0],last=null;while(chk.includes(m)){last=m;m=addMes(m,1)}
    if(!last){toast('Marque a partir do primeiro mês em aberto');return}
    S.recebidos.push({id:uid(),tipo:'mensalidade',jogId:id,nome:j.nome,meses:chk,valor:v,data:hoje(),quem,prev:j.pagoAte||null});j.pagoAte=last}
  save();fecha();toast(`${j.nome} liberado`);
  if(ctx==='chegou'&&S.atual){chegou(id);return}
  if(ctx==='presenca'&&!emAtraso(j).length){if(j.pos==='goleiro'){if(!ui.golOrdem.includes(id))ui.golOrdem.push(id)}else ui.sel.add(id)}
  render()}
function abrirReceberConv(id){const j=getJ(id);const ps=S.pendConv.filter(p=>p.jogId===id);if(!ps.length)return;
  confirmar(`Receber ${brl(ps.reduce((t,p)=>t+ +p.valor,0))} de <b>${esc(j.nome)}</b> (diária${ps.length>1?'s':''} de ${ps.map(p=>fmtData(p.data).slice(0,5)).join(', ')})?`,()=>{
    ps.forEach(p=>S.lanc.push({id:uid(),tipo:'e',cat:'Convidado',desc:`Convidado — ${j.nome} (${fmtData(p.data).slice(0,5)})`,valor:p.valor,data:hoje(),jogId:id}));S.pendConv=S.pendConv.filter(p=>!ps.includes(p));save();render();toast('Diária recebida')},'Receber')}
function itemPres(j,dia){const atr=emAtraso(j),bloq=bloqueado(j),gk=j.pos==='goleiro';
  const sel=gk?ui.golOrdem.includes(j.id):ui.sel.has(j.id);const fora=dia&&j.plano!=='ambos'&&j.plano!==dia;
  return`<div class="pres ${sel?'on':''} ${bloq?'bloq':''}" data-n="${esc(norm(j.nome))}" onclick="togPres('${j.id}')">
  <div class=chk>${sel?(gk?ui.golOrdem.indexOf(j.id)+1:'✓'):(bloq?'🔒':'')}</div>
  <div class=grow><b>${esc(j.nome)}</b>${!gk&&j.posicao?` <span class=muted>· ${esc(j.posicao)}</span>`:''}${bloq||fora||j.isento||j.convidado?`<div class=sub>${j.convidado?`<span class="tag gray">Convidado</span>${ui.conv&&ui.conv[j.id]===false?'<span class="tag yel">Paga depois</span>':ui.conv&&ui.conv[j.id]?`<span class="tag grn">Pagou ${brl(S.config.valorConvidado)}</span>`:''}`:''}${atr.length?`<span class="tag red">${txtAtraso(j,atr)}</span>`:''}${tagsCartao(j)}${fora&&!j.convidado?`<span class="tag yel">Plano: ${DIAS[j.plano].toLowerCase()}</span>`:''}${j.isento?'<span class="tag gray">Isento</span>':''}</div>`:''}</div>
  ${bloq?btnBloq(j,'presenca'):''}</div>`}
function togPres(id){const j=getJ(id);if(j.convidado&&(ui.sel.has(id)||ui.golOrdem.includes(id))){ui.sel.delete(id);ui.golOrdem=ui.golOrdem.filter(x=>x!==id);if(ui.conv)delete ui.conv[id];render();toast(j.nome+' saiu da lista');return}
  if(bloqueado(j)){toast(msgBloq(j));return}
  if(j.pos==='goleiro'){const i=ui.golOrdem.indexOf(id);i>=0?ui.golOrdem.splice(i,1):ui.golOrdem.push(id)}else ui.sel.has(id)?ui.sel.delete(id):ui.sel.add(id);render()}
function rBaba(){
  if(S.atual)return rJogo();
  const at=S.jogadores.filter(j=>j.ativo&&!j.convidado).sort(byNome);
  const cv=S.jogadores.filter(j=>j.convidado&&(ui.sel.has(j.id)||ui.golOrdem.includes(j.id)));
  if(!at.length&&restrito())return`<div class=card><h2>Lista de jogadores vazia</h2><p class=muted>Peça ao diretor financeiro o arquivo do pacote do baba e importe em <b>Mais</b>.</p><button class="btn block" onclick="go('mais')">Importar pacote</button></div>`;
  if(!at.length)return`<div class=card><h2>Bem-vindo ao Deu Baba!</h2><p class=muted>Comece cadastrando os jogadores na aba <b>Jogadores</b>. Depois é só marcar quem chegou no baba e sortear os times.</p><button class="btn block" onclick="go('jog')">Cadastrar jogadores</button></div>`;
  const aniv=cardAniv();
  const dia=diaDe(ui.dataBaba),L=at.filter(j=>j.pos!=='goleiro'),G=at.filter(j=>j.pos==='goleiro');
  const nAtr=at.filter(j=>bloqueado(j)).length;
  let h=cardDoisMeses()+aniv+`<div class=card><div class=row><div class=grow><h2 style="margin:0">Novo baba</h2><div class=muted>${dia?(dia==='ter'?'Terça':'Sábado'):'Atenção: não é terça nem sábado'}${nAtr?` · <span style="color:var(--r)">${nAtr} bloqueado${nAtr>1?'s':''}</span>`:''}</div></div><input type=date style="width:auto" value="${ui.dataBaba}" onchange="ui.dataBaba=this.value||hoje();render()"></div></div>`;
  h+=`<input placeholder="🔎 Buscar jogador..." value="${esc(ui.busca)}" oninput="ui.busca=this.value;filtrar(this.value)" style="margin-bottom:10px">`;
  h+=`<div class=row style="margin:4px 2px 8px"><h3 class=grow style="margin:0">Jogadores de linha <span class=muted>(${ui.sel.size} marcados)</span></h3>${ui.sel.size?`<button class="btn ghost sm" onclick="ui.sel.clear();render()">Limpar</button>`:''}</div>`;
  h+=L.map(j=>itemPres(j,dia)).join('')||'<p class=muted>Nenhum jogador de linha cadastrado.</p>';
  h+=`<h3 style="margin:16px 2px 2px">Goleiros <span class=muted>(${ui.golOrdem.length})</span></h3><p class=muted style="margin:0 2px 8px">Toque na ordem de chegada: o 1º vai para o Time 1, o 2º para o Time 2…</p>`;
  h+=G.map(j=>itemPres(j,dia)).join('')||'<p class=muted>Nenhum goleiro cadastrado.</p>';
  h+=`<div class=row style="margin:16px 2px 8px"><h3 class=grow style="margin:0">Convidados <span class=muted>(${cv.length})</span></h3><button class="btn sec sm" onclick="abrirConvidado('presenca')">+ Convidado</button></div>`;
  h+=cv.map(j=>itemPres(j,dia)).join('')||`<p class=muted style="margin:0 2px">Convidado paga ${brl(S.config.valorConvidado)} por baba. Toque num convidado marcado para tirar da lista.</p>`;
  ui.porTime=linhaDoDia(ui.dataBaba);const diaCfg=diaDe(ui.dataBaba)==='sab'?'sábado':'terça';
  const k=ui.porTime,n=ui.sel.size,nf=Math.floor(n/k),r=n%k;
  const prev=n?`${nf} time${nf!==1?'s':''} de ${k}${r?` + 1 de ${r}`:''}`:'marque quem está presente';
  h+=`<div style="height:150px"></div><div class=foot><div class=in>
   <div style="margin-bottom:8px"><b>${n} na linha</b> · <span class=muted>${prev}</span></div>
   <div class="row" style="flex-wrap:wrap;gap:6px"><div class="muted" style="flex-basis:100%">Times de <b style="color:var(--tx)">${k} na linha</b> + goleiro <span>(config. de ${diaCfg})</span> · <a href="#" onclick="go('mais');ui.mais='config';render();return false" style="color:var(--neon)">mudar</a></div><div class=seg><button class="${ui.balancear?'on':''}" onclick="ui.balancear=true;render()">Equilibrado</button><button class="${!ui.balancear?'on':''}" onclick="ui.balancear=false;render()">Aleatório</button></div></div>
   <button class="btn block" style="margin-top:8px" onclick="sortearBaba()" ${n>k?'':'disabled'}>Sortear times</button></div></div>`;
  return h}
function sortearBaba(){const k=linhaDoDia(ui.dataBaba),ids=[...ui.sel].filter(id=>getJ(id));if(ids.length<=k){toast('Jogadores insuficientes para 2 times');return}
  const g=montarTimes(ids,k,ui.balancear);let seq=1;
  const teams=g.map((t,i)=>({num:i+1,jog:t.map(id=>({id,seq:seq++})),gol:null}));
  const gols=ui.golOrdem.filter(id=>getJ(id));

function salvarJog(id){const v=x=>document.getElementById(x);const nome=v('jn').value.trim();if(!nome){toast('Informe o nome');return}

  save();fecha();render();toast('Jogador salvo')}
function excluirJog(id){confirmar('Excluir este jogador? Os pagamentos já lançados continuam no caixa.<br><br><span class=muted>Se ele só parou de vir, prefira desmarcar "Ativo".</span>',()=>{S.jogadores=S.jogadores.filter(j=>j.id!==id);ui.sel.delete(id);save();render()},'Excluir',true)}

/* ===================== aba MENSALIDADES ===================== */
function rMens(){const m=ui.mesMens,f=ui.filtroMens;
  const js=S.jogadores.filter(j=>cobravel(j)&&inicioJ(j)<=m).sort(byNome);
  let esp=0,rec=0,np=0;const rows=js.map(j=>{const l=pagoLanc(j,m);esp+=valorPlano(j);if(l){rec+=+l.valor;np++}return{j,l}});
  const atrJ=S.jogadores.filter(j=>!j.convidado&&emAtraso(j).length);const atrTot=atrJ.reduce((s,j)=>s+emAtraso(j).length*valorPlano(j),0);
  let h=cardDoisMeses()+mhead(m,'mesMens');

  <div class=stat><small>Falta receber no mês</small><b>${brl(Math.max(0,esp-rec))}</b></div><div class="stat r"><small>Total em atraso (${atrJ.length} jog.)</small><b>${brl(atrTot)}</b></div></div>`;
  h+=`<div class=seg style="margin-bottom:10px">${[['todos','Todos'],['pend','Pendentes'],['pagos','Pagos']].map(([k,l])=>`<button class="${f===k?'on':''}" onclick="ui.filtroMens='${k}';render()">${l}</button>`).join('')}</div>`;
  const vis=rows.filter(r=>f==='todos'||(f==='pagos'?r.l:!r.l));
  h+=`<div class="card list" style="padding:4px 12px">${vis.map(({j,l})=>`<div class=it onclick="${l?`verPag('${l.id}')`:`abrirReceber('${j.id}','${m}')`}"><div class=grow><b>${esc(j.nome)}</b><div class=muted>${DIAS[j.plano]} · ${brl(valorPlano(j))}</div></div>${l?`<span class="tag grn">Pago ${fmtData(l.data).slice(0,5)}</span>`:vencido(m)?'<span class="tag red">Atrasado</span>':'<span class="tag yel">Em aberto</span>'}</div>`).join('')||'<p class=muted>Ninguém nesta lista.</p>'}</div>`;
  {const pc={};S.pendConv.forEach(p=>{(pc[p.jogId]=pc[p.jogId]||[]).push(p)});const ks=Object.keys(pc);
   if(ks.length)h+=`<div class="card list" style="padding:4px 12px;margin-top:4px"><h3 style="margin:10px 0 2px">Diárias de convidados pendentes</h3>${ks.map(id=>`<div class=it onclick="abrirReceberConv('${id}')"><div class=grow><b>${esc(nomeJ(id))}</b><div class=muted>${pc[id].map(p=>fmtData(p.data).slice(0,5)).join(', ')}</div></div><span class="tag red">${brl(pc[id].reduce((t,p)=>t+ +p.valor,0))}</span></div>`).join('')}</div>`}
  {const ab=S.cartoes.filter(c=>!c.cancelado&&(!c.pago||suspRest(c)>0)).sort((a,b)=>b.data.localeCompare(a.data));
   h+=`<div class="card list" style="padding:4px 12px;margin-top:4px"><div class=row style="margin:10px 0 2px"><h3 class=grow style="margin:0">Cartões em aberto</h3><button class="btn sec sm" onclick="escolherCartao()">+ Cartão</button></div>
   ${ab.map(c=>`<div class=it onclick="abrirCartaoPag('${c.id}','')"><div class=grow><b>${COR[c.tipo]} ${esc(nomeJ(c.jogId))}</b><div class=muted>${fmtData(c.data)}${suspRest(c)?` · suspenso: falta${suspRest(c)>1?'m':''} ${suspRest(c)}`:''}</div></div>${c.pago?'<span class="tag grn">Pago</span>':`<span class="tag red">${brl(c.valor)}</span>`}</div>`).join('')||'<p class=muted>Nenhum cartão em aberto.</p>'}</div>`}
  h+=`<p class=muted>Vencimento todo dia ${S.config.vencimento}. Depois disso, quem não pagou fica bloqueado no sorteio. Toque no nome para receber.</p>`;
  return h}
function escolherCartao(){const js=S.jogadores.filter(j=>j.ativo).sort(byNome);
  abre(`<h2>Aplicar cartão</h2><input placeholder="🔎 Buscar..." oninput="filtrar(this.value)" style="margin-bottom:10px"><div class=chips>${js.map(j=>`<button class=chip data-n="${esc(norm(j.nome))}" onclick="abrirCartao('${j.id}')">${esc(j.nome)}</button>`).join('')}</div><button class="btn ghost block" onclick="fecha()">Cancelar</button>`)}
function verPag(lid){const l=S.lanc.find(x=>x.id===lid);abre(`<h2>Pagamento</h2><p>${esc(l.desc)}<br><b>${brl(l.valor)}</b> · pago em ${fmtData(l.data)}</p><div class=gap><button class="btn red" onclick="estornar('${lid}')">Estornar (apagar)</button><button class="btn ghost" onclick="fecha()">Fechar</button></div>`)}
function estornar(lid){confirmar('Apagar este pagamento? Ele sai do caixa e o mês volta a ficar em aberto.',()=>{S.lanc=S.lanc.filter(x=>x.id!==lid);save();render();toast('Pagamento estornado')},'Apagar',true)}

/* ===================== aba CAIXA ===================== */
function segCaixa(){const v=ui.caixaView==='eventos';return`<div class=seg style="margin-bottom:12px"><button class="${!v?'on':''}" onclick="ui.caixaView='mes';ui.evento=null;render()">Caixa do mês</button><button class="${v?'on':''}" onclick="ui.caixaView='eventos';render()">Eventos e arrecadações</button></div>`}
function resumoEv(ev){const L=S.lanc.filter(l=>l.eventoId===ev.id);const arr=soma(L.filter(l=>l.tipo==='e')),gas=soma(L.filter(l=>l.tipo==='s'));
  const P=participantes(ev);const pagos=P.filter(j=>L.some(l=>l.tipo==='e'&&l.jogId===j.id)).length;return{L,arr,gas,P,part:P.length,pagos}}
function participantes(ev){return S.jogadores.filter(j=>(j.ativo||S.lanc.some(l=>l.eventoId===ev.id&&l.jogId===j.id))&&!(ev.fora||[]).includes(j.id)).sort(byNome)}
const stats3=(a,g)=>`<div class=stats style="grid-template-columns:1fr 1fr 1fr;margin:10px 0 0"><div class="stat g"><small>Arrecadado</small><b style="font-size:21px">${brl(a)}</b></div><div class="stat r"><small>Gastos</small><b style="font-size:21px">${brl(g)}</b></div><div class=stat><small>Saldo</small><b style="font-size:21px">${brl(a-g)}</b></div></div>`;
function rEventos(){let h=segCaixa()+`<button class="btn block" style="margin-bottom:12px" onclick="abrirEvento()">+ Novo evento / arrecadação</button>`;
  const evs=S.eventos.slice().sort((a,b)=>b.data.localeCompare(a.data));
  h+=evs.map(ev=>{const r=resumoEv(ev);return`<div class=card style="cursor:pointer" onclick="ui.evento='${ev.id}';window.scrollTo(0,0);render()"><div class=row><div class=grow><h3 style="margin:0">${esc(ev.nome)}</h3><div class=muted>${fmtData(ev.data)}${ev.valor?' · '+brl(ev.valor)+' por pessoa':' · contribuição livre'}</div></div><span style="color:var(--neon);font-size:20px">›</span></div>${stats3(r.arr,r.gas)}<div class=muted style="margin-top:8px">${r.pagos} de ${r.part} já contribuíram</div></div>`}).join('')
   ||'<div class=card><p class=muted style="margin:0">Nenhum evento ainda. Use para confraternização, amistoso, Dia dos Pais… O dinheiro arrecadado e os gastos ficam separados por evento e também entram no caixa geral.</p></div>';
  return h}
function rEvento(){const ev=S.eventos.find(e=>e.id===ui.evento);if(!ev){ui.evento=null;return rEventos()}const r=resumoEv(ev);
  const meta=ev.valor?ev.valor*r.part:0;
  let h=segCaixa()+`<button class="btn ghost sm" style="margin-bottom:12px" onclick="ui.evento=null;render()">‹ Todos os eventos</button>
  <div class=card><div class=row><div class=grow><h2 style="margin:0">${esc(ev.nome)}</h2><div class=muted>${SEM[diaSemana(ev.data)]}, ${fmtData(ev.data)} · ${ev.valor?brl(ev.valor)+' por pessoa':'contribuição livre'}</div></div><button class="btn ghost sm" onclick="abrirEvento('${ev.id}')">Editar</button></div>
  ${ev.obs?`<p class=muted style="margin:8px 0 0">${esc(ev.obs)}</p>`:''}${stats3(r.arr,r.gas)}
  ${meta?`<div class=bar style="margin-top:10px;height:8px"><i style="width:${Math.min(100,r.arr/meta*100)}%"></i></div><div class=muted style="margin-top:5px">Meta ${brl(meta)} (${r.part} pessoas) · falta ${brl(Math.max(0,meta-r.arr))}</div>`:''}
  <div class=gap style="margin-top:12px"><button class="btn red" onclick="abrirLanc('s',null,'${ev.id}')">+ Gasto</button><button class="btn sec" onclick="abrirLanc('e',null,'${ev.id}')">+ Outra entrada</button><button class="btn ghost" onclick="cobrarEvento('${ev.id}')">Enviar cobrança</button></div></div>`;
  h+=`<div class="card list" style="padding:4px 12px"><h3 style="margin:10px 0 2px">Contribuições <span class=muted style="font-family:inherit;font-size:13px">(${r.pagos} de ${r.part})</span></h3>${r.P.map(j=>{const v=soma(r.L.filter(l=>l.tipo==='e'&&l.jogId===j.id));
    return`<div class=it data-n="${esc(norm(j.nome))}" onclick="opPartEv('${ev.id}','${j.id}')"><div class=grow><b>${esc(j.nome)}</b></div>${v?`<span class="tag grn">Pagou ${brl(v)}</span>`:'<span class="tag yel">Pendente</span>'}</div>`}).join('')||'<p class=muted>Ninguém.</p>'}</div>`;
  const fora=(ev.fora||[]).map(getJ).filter(Boolean);
  if(fora.length)h+=`<div class=card><h3>Não participam</h3><div class=gap>${fora.map(j=>`<button class="btn ghost sm" onclick="voltaEv('${ev.id}','${j.id}')">${esc(j.nome)} ↺</button>`).join('')}</div><p class=muted style="margin-bottom:0">Toque para incluir de novo.</p></div>`;
  const outros=r.L.filter(l=>!l.jogId).sort((a,b)=>b.data.localeCompare(a.data));
  h+=`<div class="card list" style="padding:4px 12px"><h3 style="margin:10px 0 2px">Gastos e outras entradas</h3>${outros.map(l=>`<div class=it onclick="abrirLanc('${l.tipo}','${l.id}')"><div class=grow><b>${esc(l.desc)}</b><div class=muted>${fmtData(l.data)}</div></div><span class="${l.tipo==='e'?'v-e':'v-s'}">${l.tipo==='e'?'+':'−'} ${brl(l.valor)}</span></div>`).join('')||'<p class=muted>Nenhum gasto lançado.</p>'}</div>`;
  return h}
function abrirEvento(id){const ev=id?S.eventos.find(e=>e.id===id):{nome:'',data:hoje(),valor:'',obs:''};
  abre(`<h2>${id?'Editar':'Novo'} evento</h2>
  <label>Nome<input id=en value="${esc(ev.nome)}" placeholder="Ex.: Confraternização de fim de ano"></label>
  <div class=row><label class=grow>Data<input id=ed type=date value="${ev.data}"></label><label class=grow>Valor por pessoa (R$)<input id=ev type=number inputmode=decimal step="0.01" value="${ev.valor||''}" placeholder="0 = livre"></label></div>
  <label>Observação<input id=eo value="${esc(ev.obs||'')}" placeholder="Ex.: amistoso contra o time de Jatobá"></label>
  <label>Caixinha do evento<select id=ecx>${optCaixa(ev.caixa||'Amistoso')}</select></label>
  <div class=gap><button class=btn onclick="salvarEvento('${id||''}')">Salvar</button>${id?`<button class="btn red" onclick="excluirEvento('${id}')">Excluir</button>`:''}<button class="btn ghost" onclick="fecha()">Cancelar</button></div>`)}
function salvarEvento(id){const g=x=>document.getElementById(x);const nome=g('en').value.trim();if(!nome){toast('Dê um nome ao evento');return}
  const d={nome,data:g('ed').value||hoje(),valor:parseFloat(g('ev').value)||0,obs:g('eo').value.trim(),caixa:g('ecx').value};
  if(id)Object.assign(S.eventos.find(e=>e.id===id),d);else{const ne={id:uid(),fora:[],...d};S.eventos.push(ne);ui.evento=ne.id}

function excluirEvento(id){if(S.lanc.some(l=>l.eventoId===id)){toast('Apague os pagamentos e gastos deste evento antes');return}
  confirmar('Excluir este evento?',()=>{S.eventos=S.eventos.filter(e=>e.id!==id);ui.evento=null;save();render()},'Excluir',true)}
function opPartEv(eid,jid){const ev=S.eventos.find(e=>e.id===eid),j=getJ(jid);const pg=S.lanc.filter(l=>l.eventoId===eid&&l.jogId===jid&&l.tipo==='e');
  abre(`<h2>${esc(j.nome)}</h2><p class=muted style="margin-top:0">${esc(ev.nome)}</p>${pg.length?`<p>Já contribuiu: <b style="color:var(--neon)">${brl(soma(pg))}</b> <span class=muted>(${pg.map(l=>fmtData(l.data)).join(', ')})</span></p>`:''}
  <div class=row><label class=grow>${pg.length?'Mais um pagamento':'Valor'} (R$)<input id=evv type=number inputmode=decimal step="0.01" value="${pg.length?'':(ev.valor||'')}"></label><label class=grow>Data<input id=evd type=date value="${hoje()}"></label></div>
  <div class=gap><button class=btn onclick="receberEv('${eid}','${jid}')">Registrar pagamento</button>${pg.length?`<button class="btn red" onclick="estornarEv('${eid}','${jid}')">Estornar</button>`:`<button class="btn ghost" onclick="foraEv('${eid}','${jid}')">Não participa</button>`}<button class="btn ghost" onclick="fecha()">Cancelar</button></div>`)}
function receberEv(eid,jid){const ev=S.eventos.find(e=>e.id===eid),j=getJ(jid);const v=parseFloat(document.getElementById('evv').value);if(!(v>0)){toast('Informe o valor');return}
  S.lanc.push({id:uid(),tipo:'e',cat:'Evento',caixa:ev.caixa||'Associação',desc:`${ev.nome} — ${j.nome}`,valor:v,data:document.getElementById('evd').value||hoje(),eventoId:eid,jogId:jid});save();fecha();render();toast(`${brl(v)} de ${j.nome}`)}
function estornarEv(eid,jid){confirmar('Apagar a contribuição deste sócio neste evento?',()=>{S.lanc=S.lanc.filter(l=>!(l.eventoId===eid&&l.jogId===jid&&l.tipo==='e'));save();render()},'Apagar',true)}
function foraEv(eid,jid){const ev=S.eventos.find(e=>e.id===eid);ev.fora=[...(ev.fora||[]),jid];save();fecha();render()}
function voltaEv(eid,jid){const ev=S.eventos.find(e=>e.id===eid);ev.fora=(ev.fora||[]).filter(x=>x!==jid);save();render()}
function cobrarEvento(eid){const ev=S.eventos.find(e=>e.id===eid),r=resumoEv(ev);const pg=r.P.filter(j=>r.L.some(l=>l.tipo==='e'&&l.jogId===j.id)),pe=r.P.filter(j=>!pg.includes(j));
  compartilhar(`📣 DEU BABA — ACP\n*${ev.nome}* · ${fmtData(ev.data)}\n${ev.valor?`Valor: ${brl(ev.valor)} por pessoa`:'Contribuição livre'}${ev.obs?'\n'+ev.obs:''}\n\nArrecadado até agora: ${brl(r.arr)}${ev.valor?` de ${brl(ev.valor*r.part)}`:''}\n\n✅ Já contribuíram (${pg.length}):\n${pg.map(j=>j.nome).join(', ')||'—'}\n\n⏳ Faltam (${pe.length}):\n${pe.map(j=>j.nome).join(', ')||'—'}`)}
function rCaixa(){if(ui.caixaView==='eventos')return ui.evento?rEvento():rEventos();const m=ui.mesCaixa,fim=m+'-31',fc=ui.caixaFiltro||'';
  const L0=S.lanc.filter(l=>ymOf(l.data)===m).sort((a,b)=>b.data.localeCompare(a.data));
  const L=fc?L0.filter(l=>l.tipo==='t'?(l.de===fc||l.para===fc):caixaDe(l)===fc):L0;
  const E=L.filter(l=>l.tipo==='e'),Sd=L.filter(l=>l.tipo==='s');const e=soma(E),s=soma(Sd);
  let h=segCaixa()+mhead(m,'mesCaixa');

  <div class=stats style="margin:0">${CAIXAS.map(c=>`<div class=stat style="cursor:pointer;${fc===c?'border-color:var(--neon)':''}" onclick="ui.caixaFiltro=ui.caixaFiltro==='${c}'?'':'${c}';render()"><small>${CAIXA_ICON[c]} ${c}</small><b style="font-size:24px">${brl(saldoCaixa(c,fim))}</b></div>`).join('')}</div>
  <div class=row style="margin-top:10px"><span class=grow>Saldo total</span><b style="font-family:'Bebas Neue';font-size:28px;color:var(--neon)">${brl(saldoTotal(fim))}</b></div>
  ${fc?`<p class=muted style="margin:6px 0 0">Mostrando só a caixinha <b style="color:var(--tx)">${fc}</b>. <a href="#" onclick="ui.caixaFiltro='';render();return false" style="color:var(--neon)">Ver todas</a></p>`:'<p class=muted style="margin:6px 0 0">Toque numa caixinha para ver só os lançamentos dela.</p>'}</div>`;
  h+=`<div class=stats><div class="stat g"><small>Entradas${fc?' · '+fc:''}</small><b>${brl(e)}</b></div><div class="stat r"><small>Saídas${fc?' · '+fc:''}</small><b>${brl(s)}</b></div></div>`;
  h+=`<div class=gap style="margin-bottom:12px"><button class=btn onclick="abrirReceberSocio()">Receber de sócio</button><button class="btn sec" onclick="abrirLanc('e')">+ Entrada</button><button class="btn red" onclick="abrirLanc('s')">+ Saída</button><button class="btn sec" onclick="abrirTransf()">⇄ Transferir</button><button class="btn sec" onclick="lancarAluguel()">Lançar aluguel</button><button class="btn ghost" onclick="resumoCaixa()">Enviar resumo</button></div>`;
  const cats={};L.filter(l=>l.tipo!=='t').forEach(l=>{const k=(l.tipo==='e'?'＋ ':'－ ')+l.cat;cats[k]=(cats[k]||0)+ +l.valor});
  if(Object.keys(cats).length)h+=`<div class=card><h3>Por categoria</h3>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=row style="padding:4px 0"><span class=grow>${esc(k)}</span><span class="${k[0]==='＋'?'v-e':'v-s'}">${brl(v)}</span></div>`).join('')}</div>`;
  h+=`<div class="card list" style="padding:4px 12px"><h3 style="margin:10px 0 2px">Lançamentos</h3>${L.map(l=>l.tipo==='t'?
    `<div class=it onclick="abrirTransf('${l.id}')"><div class=grow><b>${esc(l.desc||'Transferência')}</b><div class=muted>${fmtData(l.data)} · ${l.de} → ${l.para}</div></div><span style="color:var(--y);font-weight:700;white-space:nowrap">⇄ ${brl(l.valor)}</span></div>`:
    `<div class=it onclick="abrirLanc('${l.tipo}','${l.id}')"><div class=grow><b>${esc(l.desc||l.cat)}</b><div class=muted>${fmtData(l.data)} · ${esc(l.cat)} · ${CAIXA_ICON[caixaDe(l)]} ${caixaDe(l)}</div></div><span class="${l.tipo==='e'?'v-e':'v-s'}">${l.tipo==='e'?'+':'−'} ${brl(l.valor)}</span></div>`).join('')||'<p class=muted>Nenhum lançamento neste mês.</p>'}</div>`;
  if(S.config.dataAbertura)h+=`<p class=muted>Saldos de abertura em ${fmtData(S.config.dataAbertura)}: ${CAIXAS.map(c=>`${c} ${brl((S.config.saldosIniciais||{})[c]||0)}`).join(' · ')}.</p>`;
  return h}
function abrirTransf(id){const l=id?S.lanc.find(x=>x.id===id):{de:'Amistoso',para:'Associação',valor:'',data:hoje(),desc:''};
  abre(`<h2>${id?'Editar':'Nova'} transferência</h2><p class=muted style="margin-top:0">Move dinheiro de uma caixinha para outra. O saldo total não muda.</p>
  <div class=row><label class=grow>De<select id=tde>${optCaixa(l.de)}</select></label><label class=grow>Para<select id=tpa>${optCaixa(l.para)}</select></label></div>
  <div class=row><label class=grow>Valor (R$)<input id=tv type=number inputmode=decimal step="0.01" value="${l.valor}"></label><label class=grow>Data<input id=td type=date value="${l.data}"></label></div>

function salvarTransf(id){const g=x=>document.getElementById(x);const v=parseFloat(g('tv').value);if(!(v>0)){toast('Informe o valor');return}if(g('tde').value===g('tpa').value){toast('Escolha caixinhas diferentes');return}

function confirmarRS(){const R=ui.rs,j=getJ(R.jid),g=x=>document.getElementById(x);const v=parseFloat(g('rsv').value);if(!(v>0)){toast('Informe o valor');return}const d=g('rsd').value||hoje();

  save();fecha();render();toast(`${brl(v)} de ${j.nome}`)}
function abrirLanc(tipo,id,evId){const l=id?S.lanc.find(x=>x.id===id):null;if(l)tipo=l.tipo;const cats=tipo==='e'?CAT_E:CAT_S;
  if(l&&l.eventoId)evId=l.eventoId;const ev=evId&&S.eventos.find(e=>e.id===evId);
  const dd=ev||ui.mesCaixa===mesAtual()?hoje():ui.mesCaixa+'-01';const mens=l&&l.jogId;
  abre(`<h2>${l?'Editar':'Nova'} ${tipo==='e'?'entrada':ev?'gasto':'saída'}${ev?` <span class=muted style="font-family:inherit;font-size:14px">· ${esc(ev.nome)}</span>`:''}</h2>
  <label>Valor (R$)<input id=lv type=number inputmode=decimal step="0.01" value="${l?l.valor:''}" placeholder="0,00"></label>

  <label>Caixinha<select id=lcx>${optCaixa(l?caixaDe(l):ev?(ev.caixa||'Associação'):'Associação')}</select></label>
  <label>Descrição<input id=lds value="${esc(l?l.desc:'')}" placeholder="${ev?(tipo==='e'?'Ex.: doação do bar':'Ex.: carne, refrigerante, troféu'):tipo==='e'?'Ex.: patrocínio da padaria':'Ex.: bola nova'}"></label>
  <div class=gap><button class=btn onclick="salvarLanc('${tipo}','${id||''}','${evId||''}')">Salvar</button>${l?`<button class="btn red" onclick="excluirLanc('${id}')">Excluir</button>`:''}<button class="btn ghost" onclick="fecha()">Cancelar</button></div>`);
  setTimeout(()=>{const e=document.getElementById('lv');if(e&&!l)e.focus()},50)}
function salvarLanc(tipo,id,evId){const g=x=>document.getElementById(x);const valor=parseFloat(g('lv').value);if(!(valor>0)){toast('Informe um valor');return}
  const data=g('ld').value||hoje(),desc=g('lds').value.trim();
  const cx=g('lcx').value;
  if(id){const l=S.lanc.find(x=>x.id===id);l.valor=valor;l.data=data;l.desc=desc||l.desc;if(g('lc'))l.cat=g('lc').value;l.caixa=cx}
  else if(evId){const ev=S.eventos.find(e=>e.id===evId);S.lanc.push({id:uid(),tipo,cat:'Evento',caixa:cx,desc:desc||(tipo==='e'?'Entrada':'Gasto')+' — '+ev.nome,valor,data,eventoId:evId})}
  else S.lanc.push({id:uid(),tipo,cat:g('lc').value,caixa:cx,desc:desc||g('lc').value,valor,data});
  save();fecha();render();toast('Lançamento salvo')}
function excluirLanc(id){confirmar('Excluir este lançamento?',()=>{S.lanc=S.lanc.filter(x=>x.id!==id);save();render()},'Excluir',true)}
function lancarAluguel(){const m=ui.mesCaixa,v=+S.config.aluguel;const ja=S.lanc.some(l=>l.tipo==='s'&&l.cat==='Aluguel'&&ymOf(l.data)===m);
  confirmar(`Lançar aluguel de <b>${brl(v)}</b> em ${nomeMes(m)}?${ja?'<br><br><b style="color:var(--r)">Já existe um aluguel lançado neste mês.</b>':''}`,()=>{
    S.lanc.push({id:uid(),tipo:'s',cat:'Aluguel',caixa:'Associação',desc:'Aluguel '+nomeMes(m),valor:v,data:m===mesAtual()?hoje():m+'-01'});save();render();toast('Aluguel lançado')},'Lançar')}
function resumoCaixa(){const m=ui.mesCaixa;const L=S.lanc.filter(l=>ymOf(l.data)===m);const e=soma(L.filter(l=>l.tipo==='e')),s=soma(L.filter(l=>l.tipo==='s'));
  const acum=saldoTotal(m+'-31');const cxs=CAIXAS.map(c=>`${CAIXA_ICON[c]} ${c}: ${brl(saldoCaixa(c,m+'-31'))}`).join('\n');
  const js=S.jogadores.filter(j=>cobravel(j)&&inicioJ(j)<=m);const np=js.filter(j=>pagoLanc(j,m)).length;
  const sai=L.filter(l=>l.tipo==='s').map(l=>`• ${l.desc||l.cat}: ${brl(l.valor)}`).join('\n');
  compartilhar(`💰 DEU BABA — ACP\nResumo de ${nomeMes(m)}\n\nEntradas: ${brl(e)}\n  (mensalidades: ${brl(soma(L.filter(l=>l.cat==='Mensalidade')))})\nSaídas: ${brl(s)}${sai?'\n'+sai:''}\n\nResultado do mês: ${brl(e-s)}\nSaldo total: ${brl(acum)}\n${cxs}\n\nMensalidades pagas: ${np} de ${js.length}`)}
